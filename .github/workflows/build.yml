name: macOS build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: 로직 테스트
        run: swift test
      - name: 앱 빌드
        run: BUILD_ONLY=1 bash build.sh
      - name: 앱 구성 확인
        run: |
          plutil -lint build/ScheduleTimer.app/Contents/Info.plist
          codesign --verify --verbose build/ScheduleTimer.app
          ls -la build/ScheduleTimer.app/Contents/Resources/AppIcon.icns
      - name: 화면 미리보기 렌더링
        run: |
          build/ScheduleTimer.app/Contents/MacOS/ScheduleTimer --render-preview preview
          cp build/AppIcon.iconset/icon_512x512.png preview/icon.png
      - uses: actions/upload-artifact@v4
        with:
          name: preview
          path: preview/*.png
      - name: 미리보기 로그 출력 (JPEG base64)
        run: |
          for f in preview/text-*.png; do
            echo "BEGIN-IMAGE $(basename "$f")"
            base64 -b 1000 -i "$f"
            echo "END-IMAGE"
          done
          for f in preview/statusbar-*.png preview/levelup.png preview/icon.png; do
            sips -Z 1100 -s format jpeg -s formatOptions 70 "$f" --out "${f%.png}.jpg" >/dev/null
            echo "BEGIN-IMAGE $(basename "${f%.png}").jpg"
            base64 -b 1000 -i "${f%.png}.jpg"
            echo "END-IMAGE"
          done

<style>

  --ok: #1d7a46;

  --warn: #9a5b00;
  --warn-soft: #fff1d6;
  --bad: #b3261e;
  --bad-soft: #fde7e5;
  --opp: #8a2d6b;

}

  --ok: #6fd39a; --ok-soft: #173325; --warn: #f0b75a; --warn-soft: #3a2b12; --bad: #ff8a80; --bad-soft: #3d1c1a;

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {

  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  overflow-wrap: anywhere; word-break: keep-all;

a { color: var(--accent); }
button, select, input { font: inherit; color: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.topbar-inner { max-width: 1180px; margin: 0 auto; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.brand { font-size: 17px; margin: 0; flex: 1 1 auto; }
.tabs { display: flex; gap: 4px; order: 3; width: 100%; overflow: hidden; }
.tab { flex: 1 1 0; min-width: 0; padding: 8px 4px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; cursor: pointer; font-size: 14px; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
.theme-btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 13px; }

  .tabs { order: 0; width: auto; flex: 0 1 auto; }
  .tab { flex: 0 0 auto; padding: 7px 14px; }
}

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
main { padding-top: 16px; padding-bottom: 40px; }
h2 { font-size: 19px; margin: 0 0 8px; }
h3 { font-size: 16px; margin: 0 0 8px; }
h4 { font-size: 15px; margin: 12px 0 6px; }
p { margin: 6px 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; box-shadow: var(--shadow); min-width: 0; }
.panel > h2:first-child, .panel > h3:first-child { margin-top: 0; }
.grid-2 { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 960px) {
  .grid-2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
  .grid-route { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
}

/* 카드 버튼 */
.card-group { margin-bottom: 10px; }
.card-group h4 { margin: 4px 0 6px; font-size: 13px; color: var(--muted); }
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 6px; }
.card-btn { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px; cursor: pointer; min-height: 52px; display: flex; flex-direction: column; justify-content: center; position: relative; }
.card-btn:hover:not(:disabled) { border-color: var(--accent); }
.card-btn:disabled { opacity: .45; cursor: not-allowed; }
.card-btn .s { font-weight: 600; font-size: 14px; }
.card-btn .f { font-size: 11px; color: var(--muted); line-height: 1.3; }
.card-btn .cnt { position: absolute; top: 4px; right: 6px; font-size: 11px; color: var(--muted); }
.card-btn.in-hand { background: var(--accent-soft); border-color: var(--accent); }
.card-btn.init .s::after { content: " 이니시"; font-size: 10px; font-weight: 600; color: var(--accent); }

.hand-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 36px; }
.chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
.chip button { border: 0; background: none; cursor: pointer; padding: 0 2px; font-size: 15px; line-height: 1; color: var(--muted); }
.chip.accent { background: var(--accent-soft); border-color: var(--accent); }
.chip.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.chip.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.chip.warn { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.chip.opp { background: var(--opp-soft); border-color: var(--opp); color: var(--opp); }
.tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); margin: 2px 4px 2px 0; }
.tag.accent { background: var(--accent-soft); border-color: var(--accent); }
.tag.warn { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.tag.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.tag.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }

.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 14px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
.btn.small { padding: 3px 9px; font-size: 13px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.rid { display: inline-block; font-weight: 700; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; padding: 0 6px; border-radius: 6px; background: var(--accent-soft); color: var(--text); border: 1px solid var(--accent); cursor: pointer; }
button.rid { line-height: 1.5; }

.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg label { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 14px; background: var(--surface); }
.seg input:checked + span { font-weight: 700; color: var(--accent); }

.route-item { border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin: 8px 0; background: var(--surface); }
.route-item.blocked { opacity: .8; background: var(--surface-2); }
.route-item .head { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }

.plan { border-left: 3px solid var(--accent); padding-left: 10px; margin: 12px 0; }

.box { border-radius: 8px; padding: 10px 12px; margin: 8px 0; border: 1px solid var(--line); background: var(--surface-2); }
.box.ok { background: var(--ok-soft); border-color: var(--ok); }
.box.warn { background: var(--warn-soft); border-color: var(--warn); }
.box.bad { background: var(--bad-soft); border-color: var(--bad); }
.box h4 { margin-top: 0; }
.box > :last-child { margin-bottom: 0; }

mark.m { background: var(--mark); color: var(--mark-text); border-radius: 3px; padding: 0 2px; }

/* 단계 체크리스트 */
.progress { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin: 6px 0 2px; border: 1px solid var(--line); }
.progress > div { height: 100%; background: var(--accent); }
ol.steps { list-style: none; padding: 0; margin: 8px 0 0; }
ol.steps li { display: flex; gap: 8px; align-items: flex-start; padding: 7px 8px; border-radius: 8px; border: 1px solid transparent; }
ol.steps li + li { margin-top: 2px; }
ol.steps li.done .txt { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
ol.steps li.current { border-color: var(--accent); background: var(--accent-soft); }
ol.steps li.opp { background: var(--opp-soft); }
ol.steps li.opp.current { border-color: var(--opp); }
ol.steps li.picked { outline: 2px dashed var(--bad); }
ol.steps input[type=checkbox] { width: 20px; height: 20px; margin: 1px 0 0; flex: 0 0 auto; accent-color: var(--accent); cursor: pointer; }
ol.steps .num { flex: 0 0 auto; min-width: 26px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
ol.steps .txt { flex: 1 1 auto; min-width: 0; cursor: pointer; }

.trap-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.trap-btn { border: 1px solid var(--opp); background: var(--opp-soft); color: var(--text); border-radius: 8px; padding: 8px; cursor: pointer; text-align: left; font-size: 14px; }
.trap-btn[aria-pressed="true"] { background: var(--opp); color: var(--surface); font-weight: 700; }
select.full { width: 100%; padding: 7px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }

.ff-card { border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin: 8px 0; background: var(--surface); }
.ff-card.absent { opacity: .55; }
.ff-card .name { font-weight: 700; }
dl.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 10px; margin: 6px 0 0; font-size: 14px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; }

/* 문서 표: 좁은 화면에서는 행을 카드처럼 쌓는다 */
table.doc { width: 100%; border-collapse: collapse; font-size: 14px; margin: 8px 0; }

  table.doc td { border: 0; padding: 3px 10px; }
  table.doc td::before { content: attr(data-label); display: block; font-size: 12px; color: var(--muted); }

.mdoc h3 { margin-top: 18px; }
.mdoc ul, .mdoc ol { padding-left: 20px; }
details > summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
details.inner { margin: 8px 0; }
.check-list { list-style: none; padding: 0; margin: 0; font-size: 14px; }
.check-list li { padding: 3px 0; border-bottom: 1px dashed var(--line); }
.empty { text-align: center; padding: 28px 10px; color: var(--muted); }
.foot { color: var(--muted); font-size: 12px; padding-bottom: 24px; }
.sticky-sub { position: sticky; top: 96px; }
@media (max-width: 959px) { .sticky-sub { position: static; } }
</style>

걱정되면 5체째 제우스(A1·A3·A5·A6), 무한포영 등 단일 무효가 걱정되면 솔로몬 선출(A2·A4·A7)을 고른다. 실제로 맞았을 때의 분기는 \"패트랩 맞았을 때 대응\" 섹션을 본다."}}, "nameGuide": ["**5체째 제우스**: 제우스를 5번째 소환으로 내서 니비루를 제우스로 무효할 수 있게 짠 루트. 블로그 표준.", "**솔로몬 선출**: 빌가메스보다 솔로몬(코페르+랜스)을 먼저 내는 순서. 빌가메스 무효 대응 루트가 전부 여기서 갈라지므로, 유발을 맞을 확률이 높을 때 고르는 순서로 해석된다(해석, 블로그는 \"리스크 경감\"이라고만 씀).", "**토마스 미사용**: 빌가메스로 오르트로스+스케일을 놓는 변형. 토마스를 패에 잡았을 때의 대안으로 쓸 수 있다(추정).", "**4왕+상암(표), EX 제로 마키나**: 최종 필드에 제우스·사이프리트·대왕시져·데스마키나 + 앞면 상암, 엑덱에 앞면 제로 마키나."], "summonLimits": ["령왕 효과 발동 후, 빌가메스 효과 발동 후: 턴 끝까지 DD 몬스터만 특소. 비욘드 더 펜듈럼(마법사족)은 이 전에만 낼 수 있다.", "오르트로스가 몬스터로 특소되면: 그 턴 악마족만 특소.", "케플러·코페르가 P존에 있으면: DD만 펜듈럼 소환.", "제로 마키나 P효과는 P존에 \"발동\"한 턴에만 쓸 수 있다. 빌가메스나 자기 효과로 P존에 \"놓인\" 턴에는 못 쓴다(텍스트 기준 해석)."], "singletons": "메인 덱의 카운트·코페르·오르트로스·토마스·랜스·네크로·령왕·상암·다크 오컬티즘은 1장이다. 패에 잡히면 그 카드를 덱에서 부르는 단계가 막히므로 \"패 → 루트 조회표\"의 대체 지시를 따른다.", "finalField": {"rows": [{"label": "DDD 천공왕 제우스 라그나로크", "card": "DDD 천공왕 제우스 라그나로크", "zone": null, "blocks": "상대가 패에서 발동한 몬스터 효과(니비루, 패트랩 등) 무효", "cost": "묘지의 DD 몬스터 1장 + 계약서 1장 제외, 1턴 1번"}, {"label": "DDD 주혈왕 사이프리트", "card": "DDD 주혈왕 사이프리트", "zone": null, "blocks": "앞면 마법·함정 1장 효과를 다음 스탠바이까지 무효", "cost": "양 턴 사용, 1턴 1번"}, {"label": "DDD 노도대왕 이그제큐티브 시져", "card": "DDD 노도대왕 이그제큐티브 시져", "zone": null, "blocks": "특수 소환 효과를 포함한 몬스터 효과·마법·함정 발동을 무효+파괴", "cost": "소재 1개 제거. 묘지로 가면 계약서 서치"}, {"label": "DDD 사치왕 데스 마키나", "card": "DDD 사치왕 데스 마키나", "zone": null, "blocks": "상대 몬스터 효과 발동 시 그 카드를 자기 소재로 흡수", "cost": "소재 2개 제거 또는 내 계약서 1장 파괴, 같은 체인에 1번"}, {"label": "상암의 계약서(앞면)", "card": "상암의 계약서", "zone": null, "blocks": "P존에 DD 2장이 있으면, 상대는 필드 몬스터를 마/함 대상으로 못 하고 소재로도 못 씀", "cost": "내 스탠바이에 1000 데미지"}, {"label": "엑덱 앞면 제로 마키나", "card": "DDD 영사왕 제로 마키나", "zone": "엑덱 앞면", "blocks": "내 앞면 DDD/계약서가 파괴되면 엑덱에서 특소 + 필드 카드 1장 파괴", "cost": "1턴 1번"}], "intro": "표준 루트의 최종 필드는 \"4왕 + 상암(표) + 엑덱 앞면 제로 마키나\"이고, 방해는 몬스터 4개(각 1턴 1번 또는 소재 수만큼)에 상암의 상시 내성, 제로 마키나 재특소가 붙는다. 3왕 루트(F계열 등)는 이 중 제우스나 사이프리트 하나가 빠진다.", "notes": ["데스 마키나의 비용으로 상암을 파괴하면 제로 마키나 ①이 이어서 발동할 수 있다 위·P소환 횟수(제우스 추가권 포함)", "결과": "통과"}, {"확인 항목": "레벨·튜너·링크 소재 수", "결과": "통과"}, {"확인 항목": "드롤 분기(덱→패 금지)", "결과": "통과"}, {"확인 항목": "데스마키나를 링크 몬스터(빌가메스·제우스) 위에 겹치기", "결과": "가능으로 판단(추정, 근거 아래)"}, {"확인 항목": "몬스터 존 배치(링크 마커·EX 존)", "결과": "시뮬레이터 출처 루트는 시뮬레이터가 이미 검사. 블로그 수기 루트 C2·C3·E1·E2는 미검증"}], "markdown": "29개 루트 전부를 공식 한국어 카드 텍스트 기준으로 처음부터 끝까지 다시 돌렸다. 단계마다 카드 위치와 제약을 추적하는 규칙 체커(Python)를 썼고, 걸린 곳은 공식 Q&A와 MD 실전 자료로 따로 확인했다.\n\n| 확인 항목 | 결과 |\n|---|---|\n| 카드 장수·위치(덱·패·필드·묘지·제외·엑덱) | 29개 통과 |\n| 일반소환 1회 | 통과 |\n| 카드별 1턴 1번 제약 | 통과 |\n| 령왕·빌가메스 이후 \"DD만 특소\" 제약 | 통과 |\n| P 스케일 범위·P소환 횟수(제우스 추가권 포함) | 통과 |\n| 레벨·튜너·링크 소재 수 | 통과 |\n| 드롤 분기(덱→패 금지) | 통과 |\n| 데스마키나를 링크 몬스터(빌가메스·제우스) 위에 겹치기 | 가능으로 판단(추정, 근거 아래) |\n| 몬스터 존 배치(링크 마커·EX 존) | 시뮬레이터 출처 루트는 시뮬레이터가 이미 검사. 블로그 수기 루트 C2·C3·E1·E2는 미검증 |\n\n**원문 누락 보완** (전체 루트 단계 탭에 \"(원문 생략, 보완)\" 표시)\n\n- C3(블로그 2026-01-12): 제로 마키나 P효과 발동과 카운트 회수·P존 세팅 단계가 빠져 있었다. 보충 후 통과.\n- D5: 빌가메스로 제로 마키나·스케일을 P존에 놓는 단계가 빠져 있었다. 다음 단계에서 레벨 1·4를 P소환하려면 스케일 0과 9가 필요해서 보충했다. 보충 후 통과.\n- C2 11단계: 원문 \"카운트 파괴\"는 P존 제로 마키나 파괴로 읽어야 성립한다(추정).\n\n**데스마키나를 링크 위에 겹치는 문제**\n\n20개 루트(A1–A7, B1–B3, C2, C3, C4, D5, E1, E2, F1, F2, F3, F6)가 후반에 데스마키나를 빌가메스(링크 2) 위에 겹쳐 엑시즈한다.\n\n- 막는 쪽 근거: 코나미 공식 Q&A는 링크 몬스터를 엑시즈 소환의 엑시즈 소재로 쓸 수 없다고 답한다. 이유는 레벨·랭크가 없어서다. 데스마키나 補足정보는 겹쳐 엑시즈도 정규 엑시즈 소환이라고만 하고 링크 얘기는 없으며, 데스마키나 전용 Q&A 5건에도 이 질문은 없다.\n- 되는 쪽 근거: MD 커뮤니티 위키(おんJマスターデュエル部wiki)의 DDD 문서는 데스마키나가 \"대개 2번째 빌가메스 위에 겹쳐 나온다\"고, 빌가메스는 \"데스마키나 밑깔개용으로 2장 넣는다\"고 적었다. 블로그 저자도 MD 마스터1 구축에서 같은 수순을 반복해서 쓰고, 시뮬레이터 기록에는 제우스(링크) 위에 겹친 예도 있다. 또 「宵星の機神ディンギルス」는 카드 텍스트에 \"「오르페고르」 링크 몬스터 위에 겹쳐 X소환\"이 적혀 있어, 링크 위에 겹치는 소환 방식 자체가 존재한다.\n- 판단: 공식 Q&A의 금지는 레벨·랭크를 보는 일반 엑시즈 소재 얘기이고, 레벨을 보지 않는 \"DDD 몬스터 위에 겹쳐 X소환\"에는 해당하지 않는 것으로 본다(해석). MD에서 가능 — 추정(근거 강함). MD에서 직접 해보진 않았다.\n\n**규칙 메모** (카드 텍스트·공식 補足 기준)\n\n- 제로 마키나 P효과는 \"이 카드를 발동한 턴\"에만 쓸 수 있다. 빌가메스로 P존에 놓은 건 발동이 아니라서 그대로는 못 쓰고, C2처럼 패로 되돌린 뒤 P존에 발동해야 한다.\n- 빌가메스 ①은 쓸 수 있는 P존 2칸이 있어야 발동할 수 있다.\n- 아크 크라이시스를 필드·묘지 4장 제외로 특소하는 건 융합 소환이 아니다. 알프레드 ②는 \"제외되었을 경우\" 발동이라 이 방식에서 트리거된다.\n- 랜스 ②로 특소한 랜스는 필드를 벗어나면 제외되지만, 몬스터 존에서 앞면이 아니게 되면(엑시즈 소재 등) 그 상태가 풀린다. 소재로 쓴 뒤 떼어내면 묘지로 간다(해석).\n\n**남은 미검증**: C2·C3·E1·E2의 몬스터 존 배치, 그리고 29개 전부의 MD 실기 확인.", "deathOnLink": {"declaredCount": 20, "ids": ["A1", "A2", "A3", "A4", "A5", "A6", "A7", "B1", "B2", "B3", "C2", "C3", "C4", "D5", "E1", "E2", "F1", "F2", "F3", "F6"]}, "deathOnLinkBullets": ["막는 쪽 근거: 코나미 공식 Q&A는 링크 몬스터를 엑시즈 소환의 엑시즈 소재로 쓸 수 없다고 답한다. 이유는 레벨·랭크가 없어서다. 데스마키나 補足정보는 겹쳐 엑시즈도 정규 엑시즈 소환이라고만 하고 링크 얘기는 없으며, 데스마키나 전용 Q&A 5건에도 이 질문은 없다.", "되는 쪽 근거: MD 커뮤니티 위키(おんJマスターデュエル部wiki)의 DDD 문서는 데스마키나가 \"대개 2번째 빌가메스 위에 겹쳐 나온다\"고, 빌가메스는 \"데스마키나 밑깔개용으로 2장 넣는다\"고 적었다. 블로그 저자도 MD 마스터1 구축에서 같은 수순을 반복해서 쓰고, 시뮬레이터 기록에는 제우스(링크) 위에 겹친 예도 있다. 또 「宵星の機神ディンギルス」는 카드 텍스트에 \"「오르페고르」 링크 몬스터 위에 겹쳐 X소환\"이 적혀 있어, 링크 위에 겹치는 소환 방식 자체가 존재한다.", "판단: 공식 Q&A의 금지는 레벨·랭크를 보는 일반 엑시즈 소재 얘기이고, 레벨을 보지 않는 \"DDD 몬스터 위에 겹쳐 X소환\"에는 해당하지 않는 것으로 본다(해석). MD에서 가능 — 추정(근거 강함). MD에서 직접 해보진 않았다."], "supplements": ["C3(블로그 2026-01-12): 제로 마키나 P효과 발동과 카운트 회수·P존 세팅 단계가 빠져 있었다. 보충 후 통과.", "D5: 빌가메스로 제로 마키나·스케일을 P존에 놓는 단계가 빠져 있었다. 다음 단계에서 레벨 1·4를 P소환하려면 스케일 0과 9가 필요해서 보충했다. 보충 후 통과.", "C2 11단계: 원문 \"카운트 파괴\"는 P존 제로 마키나 파괴로 읽어야 성립한다(추정)."], "remaining": "C2·C3·E1·E2의 몬스터 존 배치, 그리고 29개 전부의 MD 실기 확인.", "layoutUnverifiedIds": ["C2", "C3", "E1", "E2"], "ruleMemo": ["제로 마키나 P효과는 \"이 카드를 발동한 턴\"에만 쓸 수 있다. 빌가메스로 P존에 놓은 건 발동이 아니라서 그대로는 못 쓰고, C2처럼 패로 되돌린 뒤 P존에 발동해야 한다.", "빌가메스 ①은 쓸 수 있는 P존 2칸이 있어야 발동할 수 있다.", "아크 크라이시스를 필드·묘지 4장 제외로 특소하는 건 융합 소환이 아니다. 알프레드 ②는 \"제외되었을 경우\" 발동이라 이 방식에서 트리거된다.", "랜스 ②로 특소한 랜스는 필드를 벗어나면 제외되지만, 몬스터 존에서 앞면이 아니게 되면(엑시즈 소재 등) 그 상태가 풀린다. 소재로 쓴 뒤 떼어내면 묘지로 간다(해석)."]}, "sources": {"intro": "2026-10-17 기준으로 블로그 게시물 240개와 블로거의 시뮬레이터 아카이브 68개를 확인했고, 이 덱 카드만으로 성립하는 루트만 수록했다. 루트별 출처 링크는 전체 루트 단계 탭에 있다.", "links": [{"label": "DDD研究所 (d-eye.work)", "url": "https://www.d-eye.work/", "note": ""}, {"label": "四王＋常闇（表）展開まとめ（トーマス使用）, 2026-05-02", "url": "https://www.d-eye.work/entry/2026/05/02/163109", "note": ""}, {"label": "ゼロマキナ1枚展開まとめ 몬스터 레벨을 필드+묘지 계약서 수만큼 올림. ② 묘지에서, 내 계약서 1장 파괴하고 자신 특소(필드 벗어나면 제외). 각 1턴 1번 |\n| DD 스케일 서베이어 (P9) | 레벨 조정·바운스 | ① 내 필드에 DD 펜듈럼 카드가 있으면 패에서 특소. ② 소환 시 레벨 4로. ③ 묘지로 가거나 엑덱에 앞면으로 들어가면 내 DD 펜듈럼 카드 1장을 패로. 각 1턴 1번 |\n| DD 오르트로스 (P3) | 빌가메스로 놓는 P | P효과(1턴 1번): 내 다른 DD/계약서 1장 + 필드 마/함 1장 파괴. 몬스터로 특소되면 그 턴 악마족만 특소 |\n| DD 마도현자 토마스 (P6) | 빌가메스로 놓는 P | P효과(1턴 1번): 엑덱 앞면 DD 펜듈럼 1장을 패로. 몬스터 효과: 내 P존 DD 1장 파괴 → 덱에서 레벨 8 DDD 수비 특소(그 턴 효과 무효) |\n| DD 그리폰 (P1) | 보조 | ① DD 몬스터가 있으면 패에서 수비 특소. ② P소환 시 DD/계약서 1장 버리고 1드로우. ③ 묘지에서 특소되면 그리폰 이외 DD 카드 서치. 각 1턴 1번 |\n| DD 네크로 슬라임 | 묘지 융합 | 묘지에서, 자신 포함 묘지 몬스터를 제외해 DDD 융합 소환(1턴 1번) |\n| DDD 심연왕 빌가메스 | 링크2 축 | DD 2장. 특소 시 덱에서 이름 다른 DD 펜듈럼 2장을 P존에 놓고 1000 데미지. 이후 DD만 특소. 상대에게 파괴되면 엑덱/묘지 DD 수비 특소 |\n| DDD 지혜왕 솔로몬 | 랭크4 서처 | 레벨 4 DD × 2. 소재 1개 제거 → 덱에서 DD 카드 서치 |\n| DDD 저격왕 텔 | 랭크5, 솔로몬 위에 겹침 | 랭크4 DDD 위에 엑시즈 가능. 효과 데미지를 받은 턴에 소재 1개 제거 → 상대 1000 데미지. 필드에서 묘지로 가면 덱에서 DD/계약서 1장 묘지로 |\n| DDD 성현왕 알프레드 | 융합 축 | DD × 2. ① 패/필드/제외 몬스터를 덱으로 되돌려 DDD 융합. ② 제외되면 묘지/제외 계약서 지속 카드를 필드에 앞면으로 놓음(상암 세팅 수단) |\n| DDD 열화왕 테무진 | 소생 | DD × 2. 내 필드에 DD가 특소되면 묘지 DD 1장 소생(1턴 1번) |\n| DDDD 위차원왕 아크 크라이시스 | 알프레드 제외용 | 악마족 융합·싱크로·엑시즈·펜듈럼 1장씩. 필드/묘지의 해당 카드 제외로도 특소 가능. 특소 시 상대 앞면 몬스터 효과 전부 무효 |\n| DDD 창시왕 클로비스 | 싱크로6 | 튜너+1장 이상. 싱크로 소환 시 제외된 DD 특소(필드에 계약서가 있으면 묘지에서도) |\n| DDD 주혈왕 사이프리트 | 최종 필드 | 튜너+DD. 양 턴, 앞면 마/함 1장 효과를 다음 스탠바이까지 무효(1턴 1번) |\n| DDD 노도대왕 이그제큐티브 시져 | 최종 필드 | 악마족 레벨 6 × 2. 특소 효과를 포함한 발동을 무효+파괴(소재 1개). 묘지로 가면 계약서 서치 |\n| DDD 사치왕 데스 마키나 | 최종 필드 | DDD 위에 겹쳐 엑시즈 가능. 상대 몬스터 효과 발동 시 소재 2개 제거 또는 내 계약서 1장 파괴 → 그 카드를 소재로 흡수 |\n| DDD 천공왕 제우스 라그나로크 | 링크3 | DD 2장 이상. ① 내 DD/계약서 1장 파괴 → 추가 펜듈럼 소환 1번. ② 상대가 패의 몬스터 효과를 발동하면 묘지 DD+계약서 제외해 무효(1턴 1번) |\n| DDD 노도왕 시져 | 랭크4 | 묘지로 가면 계약서 서치 |\n| 스몰 월드 | 이니시 변환 | 패 몬스터 → 덱 다리 → 덱 몬스터 서치(종족·속성·레벨·공·수 중 정확히 1개 일치) |\n| 다크 오컬티즘 | 이니시 변환 | 패 1장 버리고 덱/묘지에서 악마족 레벨 8(제로 마키나·카운트·토마스) 서치. 1턴 1번 |\n| 비욘드 더 펜듈럼 | 예비 링크 | 펜듈럼 포함 효과 몬스터 2장. 엑스트라 몬스터 존에 링크 소환 시 1200 LP 내고 펜듈럼 몬스터 서치(마법사족이라 DD만 특소 제약 중엔 못 냄) |"}, {"title": "기본 원리", "markdown": "이 덱의 1장 이니시는 케플러·지옥문·제로 마키나 9장이고, 모든 표준 루트는 \"제로 마키나 → 령왕 → 빌가메스 → 제우스 → 솔로몬·텔 → 알프레드·테무진 → 싱크로·엑시즈\" 골격을 공유한다. 이니시가 달라도 골격에 합류하는 지점만 다르다.\n\n**표준 골격 (5체째 제우스, 블로그 2026-05-02 기준)**\n\n1. 이니시로 제로 마키나를 손에 넣고 P존에 발동 → P효과로 덱에서 령왕을 앞면으로 놓음. 케플러는 일반소환으로 지옥문 서치 → 지옥문으로 제로 마키나 서치. 지옥문은 패에서 발동해 바로 제로 마키나 서치.\n2. 령왕으로 P존의 제로 마키나를 파괴 → 덱에서 카운트(또는 코페르·케플러) 특소. 파괴된 제로 마키나는 엑덱에 앞면으로 들어가 대기.\n3. 카운트 효과로 코페르(또는 케플러) 서치 → 일반소환.\n4. 빌가메스 링크(필드 DD 2장) → 덱에서 오르트로스+토마스를 P존에, 자신 1000 데미지. 이 데미지가 텔의 효과 조건이 된다.\n5. 오르트로스 P효과로 계약서(지옥문 또는 령왕)와 오르트로스 자신을 파괴 → 계약서가 파괴됐으니 제로 마키나가 엑덱에서 특소.\n6. 제우스 링크(빌가메스+제로 마키나). 여기까지가 5번째 소환이라, 상대 니비루에 제우스 ②로 체인 무효가 가능하다.\n7. 토마스 P효과로 엑덱의 카운트 회수 → P존 세팅 → 코페르·오르트로스 펜듈럼 소환.\n8. 솔로몬(레벨4 ×2) → 스케일 서치 → 텔을 솔로몬 위에 겹쳐 엑시즈 → 텔로 상대 1000 데미지 → 제우스 ①로 텔 파괴(추가 펜듈럼 소환권) → 텔 묘지 효과로 상암 또는 네크로를 묘지로.\n9. 네크로로 알프레드 융합 → 알프레드 ①로 테무진 융합.\n10. 스케일 특소(레벨 4) → 테무진으로 오르트로스 소생 → 사이프리트 싱크로.\n11. 빌가메스 다시 링크 → 아크 크라이시스 특소(알프레드·사이프리트·텔·코페르 제외) → 알프레드 ②로 상암 앞면.\n12. 오르트로스·스케일 펜듈럼 소환 → 클로비스 싱크로 → 사이프리트 소생 → 대왕시져(테무진+클로비스) → 데스마키나(빌가메스 위에 겹침).\n\n**루트 이름 읽는 법**\n\n- **5체째 제우스**: 제우스를 5번째 소환으로 내서 니비루를 제우스로 무효할 수 있게 짠 루트. 블로그 표준.\n- **솔로몬 선출**: 빌가메스보다 솔로몬(코페르+랜스)을 먼저 내는 순서. 빌가메스 무효 대응 루트가 전부 여기서 갈라지므로, 유발을 맞을 확률이 높을 때 고르는 순서로 해석된다(해석, 블로그는 \"리스크 경감\"이라고만 씀).\n- **토마스 미사용**: 빌가메스로 오르트로스+스케일을 놓는 변형. 토마스를 패에 잡았을 때의 대안으로 쓸 수 있다(추정).\n- **4왕+상암(표), EX 제로 마키나**: 최종 필드에 제우스·사이프리트·대왕시져·데스마키나 + 앞면 상암, 엑덱에 앞면 제로 마키나.\n\n**소환 제약 체크**\n\n- 령왕 효과 발동 후, 빌가메스 효과 발동 후: 턴 끝까지 DD 몬스터만 특소. 비욘드 더 펜듈럼(마법사족)은 이 전에만 낼 수 있다.\n- 오르트로스가 몬스터로 특소되면: 그 턴 악마족만 특소.\n- 케플러·코페르가 P존에 있으면: DD만 펜듈럼 소환.\n- 제로 마키나 P효과는 P존에 \"발동\"한 턴에만 쓸 수 있다. 빌가메스나 자기 효과로 P존에 \"놓인\" 턴에는 못 쓴다(텍스트 기준 해석).\n\n**1장뿐인 부품**: 메인 덱의 카운트·코페르·오르트로스·토마스·랜스·네크로·령왕·상암·다크 오컬티즘은 1장이다. 패에 잡히면 그 카드를 덱에서 부르는 단계가 막히므로 \"패 → 루트 조회표\"의 대체 지시를 따른다."}, {"title": "이니시별 1장 전개", "markdown": "이니시가 1장이면 아래 표에서 상황에 맞는 루트 ID를 고르면 된다. 단계 전체는 @진택 탭에 ID별로 있다.\n\n| 패의 이니시 | 기본: 5체째 제우스 | 유발 많이 예상: 솔로몬 선출 | 토마스를 패에 잡음 | 시작 동작 |\n|---|---|---|---|---|\n| 케플러 | A1 | A2 | B1 | 케플러 일반소환 → 지옥문 서치 → 지옥문 발동 → 제로 마키나 서치 |\n| 지옥문 | A3 | A4 | B2 | 지옥문 발동 → 제로 마키나 서치. 일반소환권은 코페르에 씀 |\n| 제로 마키나 | A5 (령왕→카운트→케플러) 또는 A6 (령왕→카운트→코페르) | A7 (령왕→케플러) | B3 | 제로 마키나 P존 발동 → 령왕 놓기 |\n\n- 5체째 제우스 루트(A1·A3·A5·A6)는 령왕으로 카운트를 부르고, 제우스를 5번째 소환으로 세워 니비루와 패의 몬스터 효과를 받는다.\n- 솔로몬 선출 루트(A2·A4·A7)는 코페르로 랜스를 묘지에 보내 레벨을 올려 솔로몬부터 만든다. 여기서 빌가메스가 무효되면 F계열로 갈라진다.\n- B계열은 빌가메스로 토마스 대신 스케일을 놓는다. \"토마스를 패에 잡았을 때\"로 쓴 건 해석이다(블로그 분류명은 \"토마스·아비스 미사용\").\n- C1은 제로 마키나 시작에서 카운트로 스케일을 서치해 일반소환하는 변형, C2는 케플러 시작에서 지옥문으로 스케일을 서치하는 변형, C3는 령왕과 상암을 둘 다 앞면으로 남기는 변형이다.\n\n어느 이니시든 령왕으로 무엇을 부르느냐로 루트가 갈리고, 그 뒤는 같은 골격으로 4왕에 도착한다."}, {"title": "2장 이상 조합", "markdown": "이 덱 카드만으로 성립하는 블로그의 2장 전용 루트는 \"제로 마키나+지옥문\"(G1) 하나뿐이다. 블로그의 다른 2장 정리글(케플러+스케일, 케플러+그리폰, 그리폰 포함 2장 등)은 아비스 라그나로크·마신왕의 계약서·헤드헌트 같은 이 덱에 없는 카드를 써서 뺐다.\n\n| 조합 | 하는 일 | 근거 |\n|---|---|---|\n| 제로 마키나 + 지옥문 | 령왕이 무효돼도 지옥문으로 코페르를 서치해 4왕까지 감 (G1) | 블로그 2026-08-01 |\n| 이니시 2장 이상 | 하나로 표준 루트를 돌리고, 나머지는 첫 이니시가 유발에 막혔을 때 다시 시작하는 예비로 둠 | 추정 |\n| 카운트 + 다른 DD 몬스터 | 카운트 ①(DD 몬스터 1장 버림)으로 특소 → ②로 제로 마키나 또는 케플러 서치 → 그 1장 루트에 합류. 카운트가 이미 나와 있으니 령왕으로 카운트를 부르는 A5·A6 대신 A7·B3처럼 령왕→케플러 쪽을 따른다 | 카드 텍스트 기반 추정 |\n| 지옥문 + 카운트(패) | 지옥문으로 제로 마키나를 서치한 뒤 A7을 1번부터 따라감(령왕→케플러라 덱의 카운트가 필요 없음) | 추정. 커뮤니티 루트는 이 덱에 없는 발키리의 계약서를 씀 |\n| 스케일 + 그리폰 | 블로그 루트(2026-10-07)가 이 덱에 없는 그래비티 컨트롤러를 써서 미확인 | 미확인 |\n\n이니시가 아닌 카드만 2장 이상인 패는 \"패 → 루트 조회표\"의 변환 수단(스몰 월드, 다크 오컬티즘)을 먼저 본다."}, {"title": "패 → 루트 빠른 조회표", "markdown": "패를 받으면 ① 이니시 확인 → ② 없으면 변환 수단 확인 → ③ 1장뿐인 부품이 패에 있는지 확인 → ④ 상대 유발 예상에 따라 기본/솔로몬 선출 선택 순서로 루트를 정한다. 남는 패트랩·함정은 전개에 쓰지 않고 상대 턴용으로 둔다.\n\n**1단계: 이니시가 있는가**\n\n| 패 | 루트 |\n|---|---|\n| 케플러 | A1 / A2 / B1 |\n| 지옥문 | A3 / A4 / B2 |\n| 제로 마키나 | A5 / A6 / A7 / B3 / C1 |\n| 제로 마키나 + 지옥문 | 기본 루트 + 령왕 무효 대비 G1 |\n\n**2단계: 이니시가 없으면 변환**\n\n스몰 월드는 덱 안에 다리 카드가 남아 있어야 한다(드롤 2장·우라라 3장 중 패에 안 잡힌 것). 경로는 이 덱 몬스터의 종족·속성·레벨·공·수를 대조해 계산했다.\n\n| 패 | 변환 | 결과 |\n|---|---|---|\n| 스몰 월드 + 우라라·후와로스·스케일·네크로 중 1장 | 보여줌 → 다리 드롤 → 제로 마키나 | 제로 마키나 루트 |\n| 스몰 월드 + 드롤·코페르·오르트로스 중 1장 | 보여줌 → 다리 우라라 → 케플러 | 케플러 루트 |\n| 스몰 월드 + 증G | 다리 스케일 → 드롤 또는 우라라만 가능 | 이니시 없음 |\n| 스몰 월드 + 그리폰 | 다리 후와로스 → 드롤·코페르·오르트로스·그리폰만 가능 | 이니시 없음 |\n| 스몰 월드 + 카운트·토마스·제로 마키나 | 카운트·토마스는 경로 없음, 제로 마키나는 이미 이니시 | — |\n| 다크 오컬티즘 + 아무 카드 1장 | 1장 버리고 덱/묘지에서 제로 마키나 서치(악마족 레벨 8) | 제로 마키나 루트 |\n| 카운트 + 다른 DD 몬스터 | 카운트 특소 → 제로 마키나/케플러 서치 | 2장 조합 표 참고 |\n\n블로거는 스몰 월드를 주로 드롤 서치(상대 드로우계 유발 대비)와 패트랩→드롤→제로 마키나 변환에 쓴다고 했다. 다크 오컬티즘은 드롤을 맞아도 전개가 가능해서 채용했다고 했는데, 제로 마키나를 버림 코스트로 보낸 뒤 묘지에서 회수하면 덱→패가 아니라서 드롤에 안 막히는 구조로 보인다(해석).\n\n**3단계: 1장뿐인 부품이 패에 있으면**\n\n| 패에 잡힌 카드 | 영향 | 대응 |\n|---|---|---|\n| 카운트 | 령왕으로 카운트를 부르는 A1·A3·A4·A5·A6·B2·C1~C4 불가 | 령왕→케플러/코페르 루트(A2·A7·B1·B3), 또는 카운트를 ①로 직접 특소(추정) |\n| 코페르 | 령왕으로 코페르를 부르는 A2·B1 불가. 카운트·지옥문으로 코페르를 서치하는 루트는 서치 대신 패의 코페르를 일반소환 | 서치 대상만 바꿈(추정) |\n| 랜스 | 랜스를 쓰는 A2·A4·A7·B·C2·C3·D1·D2·D5·D6·E·F·G1 불가 | 랜스를 안 쓰는 A1·A3·A5·A6·C1·C4·D3·D4 |\n| 토마스 | 토마스를 쓰는 A·C·D3·D6·E·G1 불가 | B계열 |\n| 오르트로스 | 빌가메스로 오르트로스를 못 놓아 계약서 파괴→제로 마키나 특소 연결이 끊김 | 블로그 루트 없음, 미확인 |\n| 네크로 | 코페르·텔로 네크로를 묘지에 못 보내 알프레드 융합이 막힘 | 블로그 루트 없음, 미확인 |\n| 령왕 | 제로 마키나가 덱에서 령왕을 못 놓음. 령왕은 지속 마법이라 패에서 바로 발동 가능하므로, 제로 마키나로는 지옥문 등 다른 계약서를 놓을 수 있음 | 추정 |\n| 상암 | 묘지→필드 세팅(알프레드 ②)이 불가 | 상암 없이 4왕까지만, 상암은 세트해서 다음 턴용(추정) |\n\n**4단계: 상대 유발 예상**\n\n니비루가 걱정되면 5체째 제우스(A1·A3·A5·A6), 무한포영 등 단일 무효가 걱정되면 솔로몬 선출(A2·A4·A7)을 고른다. 실제로 맞았을 때의 분기는 \"패트랩 맞았을 때 대응\" 섹션을 본다."}, {"title": "최종 필드와 방해 수", "markdown": "표준 루트의 최종 필드는 \"4왕 + 상암(표) + 엑덱 앞면 제로 마키나\"이고, 방해는 몬스터 4개(각 1턴 1번 또는 소재 수만큼)에 상암의 상시 내성, 제로 마키나 재특소가 붙는다. 3왕 루트(F계열 등)는 이 중 제우스나 사이프리트 하나가 빠진다.\n\n| 카드 | 막는 것 | 비용·제약 |\n|---|---|---|\n| DDD 천공왕 제우스 라그나로크 | 상대가 패에서 발동한 몬스터 효과(니비루, 패트랩 등) 무효 | 묘지의 DD 몬스터 1장 + 계약서 1장 제외, 1턴 1번 |\n| DDD 주혈왕 사이프리트 | 앞면 마법·함정 1장 효과를 다음 스탠바이까지 무효 | 양 턴 사용, 1턴 1번 |\n| DDD 노도대왕 이그제큐티브 시져 | 특수 소환 효과를 포함한 몬스터 효과·마법·함정 발동을 무효+파괴 | 소재 1개 제거. 묘지로 가면 계약서 서치 |\n| DDD 사치왕 데스 마키나 | 상대 몬스터 효과 발동 시 그 카드를 자기 소재로 흡수 | 소재 2개 제거 또는 내 계약서 1장 파괴, 같은 체인에 1번 |\n| 상암의 계약서(앞면) | P존에 DD 2장이 있으면, 상대는 필드 몬스터를 마/함 대상으로 못 하고 소재로도 못 씀 | 내 스탠바이에 1000 데미지 |\n| 엑덱 앞면 제로 마키나 | 내 앞면 DDD/계약서가 파괴되면 엑덱에서 특소 + 필드 카드 1장 파괴 | 1턴 1번 |\n\n데스 마키나의 비용으로 상암을 파괴하면 제로 마키나 ①이 이어서 발동할 수 있다(카드 텍스트상 성립하는 연계로 판단한 해석이다. 상암의 내성은 그만큼 잃는다). 덱의 도미나스 임펄스를 패에서 발동하면 그 듀얼 동안 빛·땅·바람 몬스터 효과를 못 쓴다. 이 덱에선 드롤·후와로스(바람)가 막히고, 어둠인 DD는 영향이 없다."}, {"title": "패트랩 맞았을 때 대응", "markdown": "블로그에 이 덱 카드만으로 된 대응 루트가 있는 건 니비루·드롤·증G·빌가메스 무효·령왕 무효 다섯 가지다. 우라라, 케플러 무효, 지옥문 무효에 대한 블로그 루트는 전부 이 덱에 없는 카드(아비스 등)를 써서 미확인이다.\n\n| 상대 행동 | 맞는 지점 | 대응 루트 | 최종 |\n|---|---|---|---|\n| 니비루 | 5번째 소환 이후 | 5체째 제우스 루트(A1·A3·A5·A6)에서 제우스 ②로 무효. 드롤까지 겹치면 D3 | 4왕 |\n| 드롤 & 로크 버드 | 지옥문으로 제로 마키나 서치 직후 | D1, D2 | 4왕 |\n| 드롤 & 로크 버드 | 제로 마키나 시작, 카운트로 코페르 서치 직후 | D3 | 4왕 |\n| 드롤 & 로크 버드 | 제로 마키나 시작, 카운트로 케플러 서치 직후 | D4 | 제우스+대왕시져+데스마키나 |\n| 드롤 & 로크 버드 | 케플러로 령왕 서치 직후 | D5, D6 | 3체 + (D6은 령왕 앞면) |\n| 증식의 G | 령왕 놓은 직후 | 다음 특소로 상대가 1장 드로우하면 내 드롤로 이후 드로우 차단 → E1(케플러), E2(지옥문) | 4왕 / 3체 |\n| 무한포영 등으로 빌가메스 무효 | 솔로몬 선출 후 빌가메스 링크 시 | F1·F2(케플러), F3·F4(지옥문), F5·F6(제로 마키나) | 3왕 또는 제우스+대왕시져+데스마키나 |\n| 도미나스 임펄스 등으로 령왕 무효 | 령왕 놓은 직후 | 패에 지옥문이 더 있으면 G1. 무효돼도 령왕 자체는 필드에 남아 랜스 ②의 파괴 대상이 된다 | 4왕 |\n\n- 드롤을 맞아도 루트가 이어지는 이유: 드롤은 덱→패만 막고, 령왕(덱→필드 특소)·빌가메스(덱→P존)·코페르/텔(덱→묘지)은 막지 않는다. 카드 텍스트 기준 해석.\n- 블로거는 령왕이 무효됐을 때나 \"토마스+스케일+후와로스\" 같은 패에서 비욘드 더 펜듈럼으로 전개를 늘릴 수 있다고 했지만, 구체 루트는 공개하지 않았다(2026-05 MD 구축 글).\n- 우라라는 블로그에 이 덱 전용 대응 루트가 없다. 이니시가 2장 이상이면 남은 이니시로 다시 시작하는 게 기본 대응이다(추정)."}, {"title": "검증 결과 (2026-10-17)", "markdown": "29개 루트 전부를 공식 한국어 카드 텍스트 기준으로 처음부터 끝까지 다시 돌렸다. 단계마다 카드 위치와 제약을 추적하는 규칙 체커(Python)를 썼고, 걸린 곳은 공식 Q&A와 MD 실전 자료로 따로 확인했다.\n\n| 확인 항목 | 결과 |\n|---|---|\n| 카드 장수·위치(덱·패·필드·묘지·제외·엑덱) | 29개 통과 |\n| 일반소환 1회 | 통과 |\n| 카드별 1턴 1번 제약 | 통과 |\n| 령왕·빌가메스 이후 \"DD만 특소\" 제약 | 통과 |\n| P 스케일 범위·P소환 횟수(제우스 추가권 포함) | 통과 |\n| 레벨·튜너·링크 소재 수 | 통과 |\n| 드롤 분기(덱→패 금지) | 통과 |\n| 데스마키나를 링크 몬스터(빌가메스·제우스) 위에 겹치기 | 가능으로 판단(추정, 근거 아래) |\n| 몬스터 존 배치(링크 마커·EX 존) | 시뮬레이터 출처 루트는 시뮬레이터가 이미 검사. 블로그 수기 루트 C2·C3·E1·E2는 미검증 |\n\n**원문 누락 보완** (전체 루트 단계 탭에 \"(원문 생략, 보완)\" 표시)\n\n- C3(블로그 2026-01-12): 제로 마키나 P효과 발동과 카운트 회수·P존 세팅 단계가 빠져 있었다. 보충 후 통과.\n- D5: 빌가메스로 제로 마키나·스케일을 P존에 놓는 단계가 빠져 있었다. 다음 단계에서 레벨 1·4를 P소환하려면 스케일 0과 9가 필요해서 보충했다. 보충 후 통과.\n- C2 11단계: 원문 \"카운트 파괴\"는 P존 제로 마키나 파괴로 읽어야 성립한다(추정).\n\n**데스마키나를 링크 위에 겹치는 문제**\n\n20개 루트(A1–A7, B1–B3, C2, C3, C4, D5, E1, E2, F1, F2, F3, F6)가 후반에 데스마키나를 빌가메스(링크 2) 위에 겹쳐 엑시즈한다.\n\n- 막는 쪽 근거: 코나미 공식 Q&A는 링크 몬스터를 엑시즈 소환의 엑시즈 소재로 쓸 수 없다고 답한다. 이유는 레벨·랭크가 없어서다. 데스마키나 補足정보는 겹쳐 엑시즈도 정규 엑시즈 소환이라고만 하고 링크 얘기는 없으며, 데스마키나 전용 Q&A 5건에도 이 질문은 없다.\n- 되는 쪽 근거: MD 커뮤니티 위키(おんJマスターデュエル部wiki)의 DDD 문서는 데스마키나가 \"대개 2번째 빌가메스 위에 겹쳐 나온다\"고, 빌가메스는 \"데스마키나 밑깔개용으로 2장 넣는다\"고 적었다. 블로그 저자도 MD 마스터1 구축에서 같은 수순을 반복해서 쓰고, 시뮬레이터 기록에는 제우스(링크) 위에 겹친 예도 있다. 또 「宵星の機神ディンギルス」는 카드 텍스트에 \"「오르페고르」 링크 몬스터 위에 겹쳐 X소환\"이 적혀 있어, 링크 위에 겹치는 소환 방식 자체가 존재한다.\n- 판단: 공식 Q&A의 금지는 레벨·랭크를 보는 일반 엑시즈 소재 얘기이고, 레벨을 보지 않는 \"DDD 몬스터 위에 겹쳐 X소환\"에는 해당하지 않는 것으로 본다(해석). MD에서 가능 — 추정(근거 강함). MD에서 직접 해보진 않았다.\n\n**규칙 메모** (카드 텍스트·공식 補足 기준)\n\n- 제로 마키나 P효과는 \"이 카드를 발동한 턴\"에만 쓸 수 있다. 빌가메스로 P존에 놓은 건 발동이 아니라서 그대로는 못 쓰고, C2처럼 패로 되돌린 뒤 P존에 발동해야 한다.\n- 빌가메스 ①은 쓸 수 있는 P존 2칸이 있어야 발동할 수 있다.\n- 아크 크라이시스를 필드·묘지 4장 제외로 특소하는 건 융합 소환이 아니다. 알프레드 ②는 \"제외되었을 경우\" 발동이라 이 방식에서 트리거된다.\n- 랜스 ②로 특소한 랜스는 필드를 벗어나면 제외되지만, 몬스터 존에서 앞면이 아니게 되면(엑시즈 소재 등) 그 상태가 풀린다. 소재로 쓴 뒤 떼어내면 묘지로 간다(해석).\n\n**남은 미검증**: C2·C3·E1·E2의 몬스터 존 배치, 그리고 29개 전부의 MD 실기 확인."}, {"title": "출처", "markdown": "2026-10-17 기준으로 블로그 게시물 240개와 블로거의 시뮬레이터 아카이브 68개를 확인했고, 이 덱 카드만으로 성립하는 루트만 수록했다. 루트별 출처 링크는 전체 루트 단계 탭에 있다.\n\n- [DDD研究所 (d-eye.work)](https://www.d-eye.work/)\n- [四王＋常闇（表）展開まとめ（トーマス使用）, 2026-05-02](https://www.d-eye.work/entry/2026/05/02/163109)\n- [ゼロマキナ1枚展開まとめ, 2026-03-31](https://www.d-eye.work/entry/2026/03/31/183825)\n- [【MD】DDデッキ構築 #53 (9월 마스터1), 2026-10-03](https://www.d-eye.work/entry/2026/10/03/112651) — 이 덱 리스트와 동일한 \"DD4\"\n- [【MD】DDデッキ構築 #49, 2026-05-24](https://www.d-eye.work/entry/2026/05/24/123030) — 비욘드 더 펜듈럼·다크 오컬티즘 채용 이유\n- [【MD】DDデッキ構築 #46, 2026-01-26](https://www.d-eye.work/entry/2026/01/26/150752) — 스몰 월드 운용\n- [DD 시뮬레이터 아카이브 (블로거 제작)](https://ddd-sim-iqwc.vercel.app/)\n- [코나미 공식 카드 DB (한국어)](https://www.db.yugioh-card.com/yugiohdb/card_search.action?request_locale=ko) — 카드명·효과 텍스트\n- [YGOPRODeck 카드 DB](https://db.ygoprodeck.com/api/v7/cardinfo.php) — 스몰 월드 경로 계산에 쓴 스탯\n- [코나미 Q&A: 링크 몬스터를 싱크로·엑시즈 소재로 쓸 수 있나 (fid 20748)](https://www.db.yugioh-card.com/yugiohdb/faq_search.action?ope=5&fid=20748&request_locale=ja)\n- [코나미 補足정보: DDD 사치왕 데스 마키나](https://www.db.yugioh-card.com/yugiohdb/faq_search.action?ope=4&cid=16849&request_locale=ja)\n- [코나미 補足정보: DD 랜스 솔저](https://www.db.yugioh-card.com/yugiohdb/faq_search.action?ope=4&cid=21767&request_locale=ja)\n- [코나미 補足정보: DDDD 위차원왕 아크 크라이시스](https://www.db.yugioh-card.com/yugiohdb/faq_search.action?ope=4&cid=21801&request_locale=ja)\n- [코나미 補足정보: DDD 심연왕 빌가메스](https://www.db.yugioh-card.com/yugiohdb/faq_search.action?ope=4&cid=14204&request_locale=ja)\n- [おんJマスターデュエル部wiki 【DDD】](https://onj-masterduel.game-info.wiki/d/%A1%DADDD%A1%DB) — MD에서 데스마키나를 빌가메스 위에 겹치는 운용"}], "quotes": {"urara": {"section": "패트랩 맞았을 때 대응", "text": "우라라는 블로그에 이 덱 전용 대응 루트가 없다. 이니시가 2장 이상이면 남은 이니시로 다시 시작하는 게 기본 대응이다(추정)."}, "noRecordIntro": {"section": "패트랩 맞았을 때 대응", "text": "블로그에 이 덱 카드만으로 된 대응 루트가 있는 건 니비루·드롤·증G·빌가메스 무효·령왕 무효 다섯 가지다. 우라라, 케플러 무효, 지옥문 무효에 대한 블로그 루트는 전부 이 덱에 없는 카드(아비스 등)를 써서 미확인이다."}, "drollWhy": {"section": "패트랩 맞았을 때 대응", "text": "드롤을 맞아도 루트가 이어지는 이유: 드롤은 덱→패만 막고, 령왕(덱→필드 특소)·빌가메스(덱→P존)·코페르/텔(덱→묘지)은 막지 않는다. 카드 텍스트 기준 해석."}, "beyond": {"section": "패트랩 맞았을 때 대응", "text": "블로거는 령왕이 무효됐을 때나 \"토마스+스케일+후와로스\" 같은 패에서 비욘드 더 펜듈럼으로 전개를 늘릴 수 있다고 했지만, 구체 루트는 공개하지 않았다(2026-05 MD 구축 글)."}, "twoInitiators": {"section": "2장 이상 조합", "text": "이니시 2장 이상 | 하나로 표준 루트를 돌리고, 나머지는 첫 이니시가 유발에 막혔을 때 다시 시작하는 예비로 둠 | 추정"}, "leftovers": {"section": "패 → 루트 빠른 조회표", "text": "남는 패트랩·함정은 전개에 쓰지 않고 상대 턴용으로 둔다."}, "dominusSelf": {"section": "최종 필드와 방해 수", "text": "덱의 도미나스 임펄스를 패에서 발동하면 그 듀얼 동안 빛·땅·바람 몬스터 효과를 못 쓴다. 이 덱에선 드롤·후와로스(바람)가 막히고, 어둠인 DD는 영향이 없다."}, "step4": {"section": "패 → 루트 빠른 조회표", "text": "니비루가 걱정되면 5체째 제우스(A1·A3·A5·A6), 무한포영 등 단일 무 문 1)'으로 해석했다 (가이드 2장 조합 표 '제로 마키나 + 지옥문', 대응 표 '패에 지옥문이 더 있으면').", "조회표 2단계 '카운트 + 다른 DD 몬스터': 결과 칸이 '2장 조합 표 참고'라서, 변환 칸 마지막 '제로 마키나/케플러 서치'의 카드를 이어갈 이니시로 읽었다.", "덱 리스트에 없는 카드 '니비루'가 루트 단계에 나온다: 니비루(D3-13), 니비루(D3-14). 상대가 쓰는 카드라 덱 검사에서 제외했다.", "3단계 표 '카운트' 행: 문서 불가 목록 A1,A3,A4,A5,A6,B2,C1,C2,C3,C4 / 단계에서 '령왕으로 카운트를 부르는' 루트로 검출 A1,A3,A4,A5,A6,B2,C1,C2,C3,C4,D3,D4,F3,F4 → 표에 없는 루트: D3,D4,F3,F4. 앱은 문서 목록대로 막고, 표에 없는 루트엔 '자동 검출' 주의만 붙인다.", "3단계 표 '코페르' 행: 문서 불가 목록 A2,B1 / 단계에서 '령왕으로 코페르를 부르는' 루트로 검출 A2,B1,D1,D2,D5,D6,E1,E2,F1,F2 → 표에 없는 루트: D1,D2,D5,D6,E1,E2,F1,F2. 앱은 문서 목록대로 막고, 표에 없는 루트엔 '자동 검출' 주의만 붙인다.", "단계 수를 세면 제우스가 5번째 소환인 루트가 문서 목록(A1·A3·A5·A6) 밖에도 있다: C1,C2,C3,C4,D3. 앱의 니비루 대응은 문서 목록만 '기록 있음'으로 보여준다. (소환 수는 앱이 단계 문장으로 센 값이라 참고용. '케플러·스케일 P소환'처럼 한 단계에 여러 장을 P소환하는 경우도 1회로 셌다. C2는 제우스 앞에 2장 P소환이 있어 장수로 세면 6번째가 된다.)", "C3: 최종 필드의 '령왕의 계약서'는 '최종 필드와 방해 수' 표에 항목이 없다(화면엔 카드 효과 요약만 보여줌).", "D6: 최종 필드의 '령왕의 계약서'는 '최종 필드와 방해 수' 표에 항목이 없다(화면엔 카드 효과 요약만 보여줌)."]}};

<script>
/* DD4 전개 도우미 — 바닐라 JS. 데이터는 data/dd-data.js(window.DD_DATA)에서 읽는다. */
(function () {
  'use strict';

  var D = window.DD_DATA;
  var app = document.getElementById('app');
  if (!D) {
    app.innerHTML = '<div class="panel"><h2>데이터를 못 불러왔다<\/h2><p>data/dd-data.js 파일이 없거나 깨졌다. ' +
      'README.md의 "데이터 다시 만들기" 명령을 실행한 뒤 새로고침해줘.<\/p><\/div>';
    return;
  }
  var C = D.config;
  var HAND_MAX = 6;

  // ------------------------------------------------------------ 색인
  var cardsByName = {}, routesById = {}, effectsByCard = {}, ffByCard = {}, groupsById = {};
  D.cards.forEach(function (c) { cardsByName[c.name] = c; });
  D.routes.forEach(function (r) { routesById[r.id] = r; });
  D.cardEffects.forEach(function (e) { effectsByCard[e.card] = e; });
  D.finalField.rows.forEach(function (f) { ffByCard[f.card] = f; });
  D.groups.forEach(function (g) { groupsById[g.id] = g; });
  var mainCards = D.cards.filter(function (c) { return c.zone === '메인'; });

  function short(name) { return (cardsByName[name] && cardsByName[name].short) || name; }

  // ------------------------------------------------------------ 저장(localStorage, 실패해도 동작)
  var KEY = 'dd4-helper-v1';
  function loadState() {
    try { return JSON.parse(window.localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
  }
  function saveState() {
    try { window.localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* 저장 불가 환경 */ }
  }
  var state = Object.assign({ tab: 'hand', hand: {}, concern: 'none', routeId: null, checks: {}, trap: null, rev: 'handMonster', theme: 'auto' }, loadState());
  // 저장된 값 정리(덱이 바뀌었을 때 대비)
  Object.keys(state.hand).forEach(function (n) {
    var c = cardsByName[n];
    if (!c || c.zone !== '메인' || !(state.hand[n] > 0)) delete state.hand[n];
    else state.hand[n] = Math.min(state.hand[n], c.count);
  });
  if (state.routeId && !routesById[state.routeId]) state.routeId = null;

  // ------------------------------------------------------------ 문자열 도우미
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }
  var MARK_RE = /(원문 생략|미검증|미확인|추정|해석|보완|생략)/g;
  function hl(s) { return esc(s).replace(MARK_RE, '<mark class="m">$1<\/mark>'); }
  // 문장 속 루트 ID를 누르면 그 루트를 여는 버튼으로 바꾼다
  function linkIds(htmlText) {
    return htmlText.replace(/(^|[^A-Za-z0-9])([A-G]\d{1,2})(?![0-9A-Za-z])/g, function (m, pre, id) {
      return routesById[id] ? pre + '<button class="rid" data-act="open-route" data-id="' + id + '">' + id + '<\/button>' : m;
    });
  }
  function inline(s) {
    var h = hl(s);
    h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1<\/strong>');
    h = h.replace(/`([^`]+)`/g, '<code>$1<\/code>');
    h = h.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1<\/a>');
    return h;
  }
  function textBlock(s) { return linkIds(inline(s)); }

  // 아주 작은 마크다운 렌더러(문서 탭용): 제목, 표, 목록, 문단
  function md(src) {
    var lines = String(src || '').split('\n'), out = '', i = 0;
    function isBlockStart(l) { return /^#{1,4}\s/.test(l) || /^- /.test(l) || /^\d+\.\s/.test(l) || /^\s*\|/.test(l); }
    while (i < lines.length) {
      var l = lines[i];
      if (!l.trim()) { i++; continue; }
      var m = l.match(/^(#{1,4})\s+(.*)$/);
      if (m) { var lv = Math.min(m[1].length + 2, 6); out += '<h' + lv + '>' + inline(m[2]) + '<\/h' + lv + '>'; i++; continue; }
      if (/^\s*\|/.test(l) && lines[i + 1] && /^\s*\|\s*-/.test(lines[i + 1])) {
        var head = cells(l); i += 2; var rows = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(cells(lines[i])); i++; }
        out += table(head, rows);
        continue;
      }
      if (/^- /.test(l)) {
        out += '<ul>';
        while (i < lines.length && /^- /.test(lines[i])) { out += '<li>' + textBlock(lines[i].slice(2)) + '<\/li>'; i++; }
        out += '<\/ul>'; continue;
      }
      if (/^\d+\.\s/.test(l)) {
        out += '<ol>';
        while (i < lines.length && /^\d+\.\s/.test(lines[i])) { out += '<li>' + textBlock(lines[i].replace(/^\d+\.\s+/, '')) + '<\/li>'; i++; }
        out += '<\/ol>'; continue;
      }
      var buf = [];
      while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) { buf.push(lines[i].trim()); i++; }
      out += '<p>' + textBlock(buf.join(' ')) + '<\/p>';
    }
    return out;
  }
  function cells(line) { return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(function (c) { return c.trim(); }); }
  function table(head, rows) {
    var h = '<table class="doc"><thead><tr>' + head.map(function (c) { return '<th>' + inline(c) + '<\/th>'; }).join('') + '<\/tr><\/thead><tbody>';
    rows.forEach(function (r) {
      h += '<tr>' + head.map(function (hd, k) { return '<td data-label="' + esc(hd) + '">' + textBlock(r[k] || '') + '<\/td>'; }).join('') + '<\/tr>';
    });
    return h + '<\/tbody><\/table>';
  }
  function quote(q) {
    if (!q) return '';
    return '<blockquote class="q">' + textBlock(q.text) + '<span class="src">dd-guide.md · ' + esc(q.section) + '<\/span><\/blockquote>';
  }
  function routeTitle(r) { return '<button class="rid" data-act="open-route" data-id="' + r.id + '">' + r.id + '<\/button> ' + hl(r.name); }

  // ------------------------------------------------------------ 패 계산
  function handSize(hand) { return Object.keys(hand).reduce(function (a, k) { return a + hand[k]; }, 0); }
  function cnt(hand, name) { return hand[name] || 0; }
  function deckLeft(hand, name) { return (cardsByName[name] ? cardsByName[name].count : 0) - cnt(hand, name); }
  function initiatorCount(hand) { return C.initiatorCards.reduce(function (a, c) { return a + cnt(hand, c); }, 0); }

  // 조건 목록(requires)을 서로 다른 카드로 채울 수 있는지
  function satisfies(reqs, hand) {
    var pool = Object.assign({}, hand), used = [];
    for (var i = 0; i < reqs.length; i++) {
      var r = reqs[i], pick = null;
      if (r.kind === 'initiatorCount') { if (initiatorCount(hand) < r.min) return null; continue; }
      var keys = Object.keys(pool).filter(function (k) { return pool[k] > 0; });
      if (r.kind === 'anyOf') pick = r.cards.filter(function (c) { return pool[c] > 0; })[0];
      else if (r.kind === 'otherDD') pick = keys.filter(function (k) { return cardsByName[k] && cardsByName[k].isDD; })[0];
      else if (r.kind === 'any') pick = keys[0];
      if (!pick) return null;
      pool[pick]--; used.push(pick);
    }
    return used;
  }

  var IT = D.initiatorTable;
  var KIND_LABEL = {
    'default': IT.header[1], solomon: IT.header[2], thomas: IT.header[3],
    lookup: '조회표 1단계에 있음', variant: '기타 변형'
  };
  var variantBullet = (IT.bullets || []).filter(function (b) { return b.indexOf('C1은') === 0; })[0] || '';

  function routesForInitiator(init) {
    var row = IT.rows.filter(function (r) { return r.initiator === init; })[0];
    var items = [], seen = {};
    function add(id, kind) { if (!seen[id] && routesById[id]) { seen[id] = 1; items.push({ id: id, kind: kind }); } }
    if (row) {
      row['default'].ids.forEach(function (id) { add(id, 'default'); });
      row.solomon.ids.forEach(function (id) { add(id, 'solomon'); });
      row.thomas.ids.forEach(function (id) { add(id, 'thomas'); });
    }
    D.lookup.step1.rows.forEach(function (r) {
      if (r.cards.length === 1 && r.cards[0] === init) r.ids.forEach(function (id) { add(id, 'lookup'); });
    });
    D.routes.forEach(function (r) {
      if (r.group === 'C' && r.initiator.length === 1 && r.initiator[0] === init) add(r.id, 'variant');
    });
    return { row: row, items: items };
  }

  function rankOf(item, hand, concern) {
    var base = { 'default': 1, solomon: 2, thomas: 3, lookup: 4, variant: 5 }[item.kind];
    if (concern === 'negate' && item.kind === 'solomon') base = 0.5;
    if (cnt(hand, 'DD 마도현자 토마스') > 0 && item.kind === 'thomas') base = 0.2;
    return base;
  }

  function decorate(item, hand) {
    var r = routesById[item.id], tags = [], blocked = [], cautions = [];
    tags.push({ t: KIND_LABEL[item.kind], cls: 'accent' });
    if (C.routeSets['5체째 제우스'].indexOf(r.id) >= 0) tags.push({ t: '니비루 걱정이면 이쪽', cls: '' });
    if (C.routeSets['솔로몬 선출'].indexOf(r.id) >= 0) tags.push({ t: '단일 무효 걱정이면 이쪽', cls: '' });
    if (item.kind === 'thomas') tags.push({ t: '(해석)', cls: 'warn' });
    (D.lookup.step3.rows || []).forEach(function (row) {
      if (!row.card || cnt(hand, row.card) === 0) return;
      if (row.blockedIds.indexOf(r.id) >= 0) blocked.push(row);
      else if ((row.autoDetectedIds || []).indexOf(r.id) >= 0)
        cautions.push('자동 검출: 이 루트도 ' + short(row.card) + '을(를) 덱에서 부르는 단계가 있다. 3단계 표 목록에는 없는 루트.');
    });
    r.requiredHand.forEach(function (q) {
      if (q.reason !== '루트 이름의 시작 카드' && cnt(hand, q.card) === 0) cautions.push('필요한 패: ' + short(q.card) + ' (' + q.reason + ')');
    });
    return { id: r.id, kind: item.kind, tags: tags, blocked: blocked, cautions: cautions };
  }

  function evaluate(hand, concern) {
    var res = { plans: [], combos: [], convInfo: [], parts: [], inits: [], responses: [] };
    var inits = C.initiatorCards.filter(function (c) { return cnt(hand, c) > 0; });
    res.inits = inits;
    function plan(kind, title, detail, init) {
      var rf = routesForInitiator(init);
      var items = rf.items.map(function (it) { return decorate(it, hand); });
      items.sort(function (a, b) { return rankOf(a, hand, concern) - rankOf(b, hand, concern); });
      res.plans.push({ kind: kind, title: title, detail: detail, init: init, start: rf.row ? rf.row.start : '', items: items });
    }
    inits.forEach(function (init) { plan('initiator', '이니시: ' + short(init) + ' (' + cnt(hand, init) + '장)', '', init); });
    // 1단계 조회표의 2장 행(제로 마키나 + 지옥문)
    D.lookup.step1.rows.forEach(function (r) {
      if (r.cards.length > 1 && r.cards.every(function (c) { return cnt(hand, c) > 0; })) {
        res.combos.push({ title: '조회표 1단계: ' + r.hand, text: r.routes, basis: '' });
      }
    });
    // 2장 이상 조합 표
    D.combos.rows.forEach(function (c) {
      if (satisfies(c.requires, hand)) res.combos.push({ title: '2장 조합 표: ' + c.combo, text: c.action, basis: c.basis });
    });
    // 이니시가 없으면 변환 수단
    if (!inits.length) {
      D.lookup.step2.rows.forEach(function (cv) {
        var used = satisfies(cv.requires, hand);
        if (!used) return;
        var bridgeOk = !cv.bridge || deckLeft(hand, cv.bridge) > 0;
        if (cv.resultInitiators.length && bridgeOk) {
          cv.resultInitiators.forEach(function (init) {
            plan('conversion', '변환: ' + cv.hand + ' → ' + short(init) + ' 루트', cv.conversion + (cv.result.indexOf('참고') >= 0 ? ' (결과: ' + cv.result + ')' : ''), init);
          });
        } else {
          res.convInfo.push({ cv: cv, bridgeOk: bridgeOk });
        }
      });
    }
    // 3단계: 1장뿐인 부품
    (D.lookup.step3.rows || []).forEach(function (row) { if (row.card && cnt(hand, row.card) > 0) res.parts.push(row); });
    // 갈아탈 루트(D~G)
    var initSet = {};
    res.plans.forEach(function (p) { initSet[p.init] = 1; });
    D.handTrapResponses.rows.forEach(function (row) {
      var ids = row.ids.filter(function (id) { var r = routesById[id]; return r && 'DEFG'.indexOf(r.group) >= 0 && initSet[r.initiator[0]]; });
      if (ids.length) res.responses.push({ row: row, ids: ids });
    });
    return res;
  }
  function viable(res) { return res.plans.some(function (p) { return p.items.some(function (i) { return !i.blocked.length; }); }); }

  function oneMore(hand, concern) {
    var out = [];
    mainCards.forEach(function (c) {
      if (deckLeft(hand, c.name) <= 0) return;
      var h2 = Object.assign({}, hand); h2[c.name] = cnt(h2, c.name) + 1;
      var r2 = evaluate(h2, concern);
      if (!viable(r2)) return;
      var via = r2.plans.filter(function (p) { return p.items.some(function (i) { return !i.blocked.length; }); }).map(function (p) {
        return { title: p.title, detail: p.detail, ids: p.items.filter(function (i) { return !i.blocked.length; }).map(function (i) { return i.id; }) };
      });
      out.push({ card: c, via: via });
    });
    return out;
  }

  // ------------------------------------------------------------ 패트랩 대응
  function summonsUpTo(route, n) { return route.steps.filter(function (s) { return s.n <= n && s.isSummon; }).length; }
  function currentStep(route) {
    var done = state.checks[route.id] || [];
    var s = route.steps.filter(function (st) { return done.indexOf(st.n) < 0; })[0];
    return s ? s.n : route.steps.length;
  }
  function commonPrefix(a, b) {
    var k = 0;
    while (k < a.steps.length && k < b.steps.length && a.steps[k].text === b.steps[k].text) k++;
    return k;
  }
  function branchInfo(cur, t) {
    var opp = t.steps.filter(function (s) { return s.opponent; })[0];
    return { target: t, opp: opp, from: opp ? opp.n + 1 : 1, prefix: commonPrefix(cur, t) };
  }

  function respond(key, route, stepN) {
    var btn = C.handTrapButtons.filter(function (b) { return b.key === key; })[0];
    var rows = D.handTrapResponses.rows.filter(function (r) { return btn.rows.some(function (k) { return r.action.indexOf(k) >= 0; }); });
    var out = { btn: btn, rows: rows, matches: [], hints: [], mismatch: [] };
    rows.forEach(function (row) {
      var rule = C.responseRules.filter(function (u) { return row.action.indexOf(u.action) >= 0 && row.timing.indexOf(u.timing) >= 0; })[0];
      if (!rule) return;
      if (rule.type === 'afterNthSummon') {
        if (rule.appliesOn.indexOf(route.id) < 0) return;
        var k = summonsUpTo(route, stepN);
        var zs = route.steps.filter(function (s) { return s.summonIndex === rule.n; })[0];
        if (k >= rule.n) out.matches.push({ row: row, rule: rule, mode: 'continue', k: k, zstep: zs });
        else out.hints.push({ row: row, step: zs ? zs.n : null, text: (zs ? zs.n + '단계(' + rule.n + '번째 소환: ' + zs.text + ')' : rule.n + '번째 소환') + ' 이후' });
        return;
      }
      if (rule.appliesOnSet && C.routeSets[rule.appliesOnSet].indexOf(route.id) < 0) return;
      var re = new RegExp(rule.pattern);
      var hits = route.steps.filter(function (s) { return !s.opponent && re.test(s.text); });
      if (rule.firstMatchOnly) hits = hits.slice(0, 1);
      if (!hits.length) return;
      var targets = row.ids.map(function (id) { return routesById[id]; }).filter(function (t) { return t && t.initiator.indexOf(route.initiator[0]) >= 0; });
      var hitHere = hits.some(function (h) { return h.n === stepN; });
      if (!targets.length) { if (hitHere) out.mismatch.push({ row: row }); return; }
      if (hitHere) out.matches.push({ row: row, rule: rule, mode: 'switch', targets: targets.map(function (t) { return branchInfo(route, t); }) });
      else out.hints.push({ row: row, step: hits[0].n, text: hits[0].n + '단계(' + hits[0].text + ') 직후' });
    });
    return out;
  }

  // ------------------------------------------------------------ 렌더: 패 선택
  function renderHand() {
    var hand = state.hand, size = handSize(hand);
    var groups = ['몬스터', '마법', '함정'];
    var h = '<div class="grid-2"><section class="panel"><h2>패 고르기<\/h2>' +
      '<p class="small muted">카드를 누르면 패에 들어간다. 최대 ' + HAND_MAX + '장, 카드별로 덱 장수까지. 오른쪽 위 숫자 = 패/덱 장수.<\/p>' +
      '<div class="hand-bar" aria-live="polite"><strong>패 ' + size + '/' + HAND_MAX + '<\/strong>';
    if (!size) h += '<span class="muted small">비어 있음<\/span>';
    Object.keys(hand).forEach(function (n) {
      for (var i = 0; i < hand[n]; i++) h += '<span class="chip accent">' + esc(short(n)) + '<button data-act="hand-del" data-name="' + esc(n) + '" aria-label="' + esc(short(n)) + ' 빼기">×<\/button><\/span>';
    });
    if (size) h += '<button class="btn small" data-act="hand-clear">비우기<\/button>';
    h += '<\/div>';
    groups.forEach(function (g) {
      h += '<div class="card-group"><h4>' + g + '<\/h4><div class="card-grid">';
      mainCards.filter(function (c) { return c.category === g; }).forEach(function (c) {
        var n = cnt(hand, c.name), dis = n >= c.count || size >= HAND_MAX;
        h += '<button class="card-btn' + (n ? ' in-hand' : '') + (c.isInitiator ? ' init' : '') + '" data-act="hand-add" data-name="' + esc(c.name) + '"' + (dis ? ' disabled' : '') +
          ' title="' + esc(c.name + (c.note ? ' · ' + c.note : '')) + '"><span class="cnt">' + n + '/' + c.count + '<\/span><span class="s">' + esc(c.short) + '<\/span><span class="f">' + esc(c.name) + '<\/span><\/button>';
      });
      h += '<\/div><\/div>';
    });
    h += '<details class="inner"><summary>EX 덱 (패에 넣지 않음)<\/summary><p class="small">' +
      D.cards.filter(function (c) { return c.zone === 'EX'; }).map(function (c) { return esc(c.name) + ' ×' + c.count + ' <span class="muted">(' + esc(c.note) + ')<\/span>'; }).join('<br>') + '<\/p><\/details>';
    h += '<\/section><section class="panel" id="recs">' + renderRecs() + '<\/section><\/div>';
    return h;
  }

  function concernSel() {
    return '<div class="seg" role="radiogroup" aria-label="상대 유발 예상">' + C.concernOptions.map(function (o) {
      return '<label><input type="radio" name="concern" value="' + o.key + '"' + (state.concern === o.key ? ' checked' : '') + ' data-act="concern"><span>' + esc(o.label) + '<\/span><\/label>';
    }).join('') + '<\/div>' + quote(D.quotes.step4);
  }

  function routeItemHtml(it) {
    var r = routesById[it.id];
    var h = '<div class="route-item' + (it.blocked.length ? ' blocked' : '') + '"><div class="head"><div class="title">' + routeTitle(r) + '<\/div>' +
      (it.blocked.length ? '<span class="tag bad">이 패로는 막힘<\/span>' : '<button class="btn primary small" data-act="start-route" data-id="' + r.id + '">이 루트로 진행<\/button>') + '<\/div><div>';
    it.tags.forEach(function (t) { h += '<span class="tag ' + t.cls + '">' + hl(t.t) + '<\/span>'; });
    h += '<\/div><div class="small muted">최종: ' + hl(r.finalText) + (r.source ? ' · <a href="' + esc(r.source.url) + '" target="_blank" rel="noopener">' + esc(r.source.label) + '<\/a>' : '') + '<\/div>';
    if (it.kind === 'variant' && variantBullet) h += '<div class="small">' + textBlock(variantBullet) + '<\/div>';
    it.blocked.forEach(function (b) {
      h += '<div class="box bad small"><strong>' + esc(b.cardText) + '이(가) 패에 있음<\/strong> — ' + textBlock(b.effect) + '<br>대응: ' + textBlock(b.response) + ' <span class="muted">(조회표 3단계)<\/span><\/div>';
    });
    it.cautions.forEach(function (c) { h += '<div class="box warn small">' + textBlock(c) + '<\/div>'; });
    return h + '<\/div>';
  }

  function renderRecs() {
    var hand = state.hand, size = handSize(hand);
    var h = '<h2>추천 루트<\/h2>';
    h += '<h4>상대 유발 예상<\/h4>' + concernSel();
    if (!size) return h + '<div class="empty">왼쪽에서 패를 고르면 문서의 조회표·1장/2장 조합 기준으로 루트를 보여준다.<\/div>';
    var res = evaluate(hand, state.concern);
    var ok = viable(res);
    if (res.plans.length) {
      res.plans.forEach(function (p) {
        var good = p.items.filter(function (i) { return !i.blocked.length; }), bad = p.items.filter(function (i) { return i.blocked.length; });
        h += '<div class="plan' + (p.kind === 'conversion' ? ' conv' : '') + '"><h3>' + hl(p.title) + '<\/h3>';
        if (p.detail) h += '<p class="small">' + textBlock(p.detail) + '<\/p>';
        if (p.start) h += '<p class="small"><span class="muted">시작 동작:<\/span> ' + textBlock(p.start) + '<\/p>';
        good.forEach(function (i) { h += routeItemHtml(i); });
        if (bad.length) h += '<details class="inner"><summary>막힌 루트 ' + bad.length + '개<\/summary>' + bad.map(routeItemHtml).join('') + '<\/details>';
        h += '<\/div>';
      });
    }
    if (!ok) {
      h += '<div class="box bad"><h4>이 패로 기록된 루트 없음<\/h4><p class="small">이니시(케플러·지옥문·제로 마키나)와 변환 수단(스몰 월드·다크 오컬티즘·카운트 조합) 중 이 패로 성립하는 루트가 문서에 없다.<\/p><\/div>';
      var more = oneMore(hand, state.concern);
      h += '<h3>카드 1장만 더 있으면 되는 루트<\/h3>';
      if (size >= HAND_MAX) h += '<p class="small muted">지금 패가 ' + size + '장이라 1장을 더하면 ' + (size + 1) + '장이 된다(계산은 그냥 1장 추가 기준).<\/p>';
      if (!more.length) h += '<p class="muted">1장 추가로 성립하는 기록도 없다.<\/p>';
      more.forEach(function (m) {
        h += '<div class="route-item"><div class="title">+ ' + esc(m.card.short) + ' <span class="muted small">' + esc(m.card.name) + ' · 덱에 ' + deckLeft(hand, m.card.name) + '장 남음<\/span><\/div>';
        m.via.forEach(function (v) {
          h += '<div class="small">' + hl(v.title) + (v.detail ? ' — ' + textBlock(v.detail) : '') + '<br>' + v.ids.map(function (id) { return '<button class="rid" data-act="open-route" data-id="' + id + '">' + id + '<\/button>'; }).join(' ') + '<\/div>';
        });
        h += '<\/div>';
      });
    }
    if (res.convInfo.length) {
      h += '<h4>변환 표에 있지만 이니시로 못 가는 경우<\/h4>';
      res.convInfo.forEach(function (ci) {
        h += '<div class="box warn small"><strong>' + hl(ci.cv.hand) + '<\/strong> — ' + textBlock(ci.cv.conversion) + ' → ' + hl(ci.cv.result) +
          (!ci.bridgeOk ? '<br>다리 카드 ' + esc(short(ci.cv.bridge)) + '가 덱에 남아 있지 않다(전부 패에 있음).' : '') + '<\/div>';
      });
    }
    if (res.combos.length) {
      h += '<h4>패에 해당하는 조합 기록<\/h4>';
      res.combos.forEach(function (c) { h += '<div class="box small"><strong>' + hl(c.title) + '<\/strong><br>' + textBlock(c.text) + (c.basis ? ' <span class="tag">근거: ' + hl(c.basis) + '<\/span>' : '') + '<\/div>'; });
    }
    if (res.parts.length) {
      h += '<h4>1장뿐인 부품이 패에 있음 (조회표 3단계)<\/h4>';
      res.parts.forEach(function (p) {
        h += '<div class="box warn small"><strong>' + esc(p.cardText) + '<\/strong> — ' + textBlock(p.effect) + '<br>대응: ' + textBlock(p.response) + '<\/div>';
      });
    }
    if (res.responses.length) {
      h += '<h4>맞았을 때 갈아탈 루트 (이 이니시 기준)<\/h4><ul class="small">';
      res.responses.forEach(function (x) {
        h += '<li><strong>' + hl(x.row.action) + '<\/strong> · ' + hl(x.row.timing) + ' → ' + x.ids.map(function (id) { return '<button class="rid" data-act="open-route" data-id="' + id + '">' + id + '<\/button>'; }).join(' ') + ' <span class="muted">(최종: ' + hl(x.row.final) + ')<\/span><\/li>';
      });
      h += '<\/ul>';
    }
    var notes = [];
    if (initiatorCount(hand) >= 2) notes.push(D.quotes.twoInitiators);
    if (cnt(hand, '도미나스 임펄스') > 0) notes.push(D.quotes.dominusSelf);
    if (size) notes.push(D.quotes.leftovers);
    if (notes.length) h += '<h4>문서 메모<\/h4>' + notes.map(quote).join('');
    return h;
  }

  // ------------------------------------------------------------ 렌더: 루트 진행
  function renderRoute() {
    var r = routesById[state.routeId];
    if (!r) return '<div class="panel empty">진행 중인 루트가 없다. <button class="btn" data-act="tab" data-tab="hand">패 선택<\/button> 또는 <button class="btn" data-act="tab" data-tab="all">전체 루트<\/button>에서 골라줘.<\/div>';
    var g = groupsById[r.group], done = state.checks[r.id] || [], cur = currentStep(r);
    var allDone = done.length >= r.steps.length;
    var pct = Math.round(done.length / r.steps.length * 100);
    var picked = state.trap && state.trap.routeId === r.id ? state.trap.step : null;
    var h = '<div class="grid-2 grid-route"><section class="panel"><h2>' + routeTitle(r) + '<\/h2>' +
      '<p class="small muted">' + esc(g.id + '. ' + g.title) + (g.headerFinal ? ' — 그룹 최종: ' + hl(g.headerFinal) : '') + '<\/p>';
    h += '<p class="small"><span class="muted">필요한 패:<\/span> ' + r.requiredHand.map(function (q) {
      var have = cnt(state.hand, q.card) > 0, entered = handSize(state.hand) > 0;
      return '<span class="chip ' + (!entered ? '' : have ? 'ok' : 'bad') + '" title="' + esc(q.reason) + '">' + esc(short(q.card)) + (entered ? (have ? ' ✓' : ' 패에 없음') : '') + '<\/span>';
    }).join(' ') + '<\/p>';
    h += '<p class="small"><span class="muted">최종:<\/span> ' + hl(r.finalText) + (r.source ? ' · 출처 <a href="' + esc(r.source.url) + '" target="_blank" rel="noopener">' + esc(r.source.label) + '<\/a>' : '') + '<\/p>';
    h += '<div class="progress" aria-hidden="true"><div style="width:' + pct + '%"><\/div><\/div><p class="small">' + done.length + ' / ' + r.steps.length + ' 단계 완료' + (allDone ? ' — 끝!' : ' · 현재 ' + cur + '단계') + '<\/p>';
    h += '<div class="btn-row"><button class="btn primary" data-act="next-step"' + (allDone ? ' disabled' : '') + '>현재 단계 완료<\/button><button class="btn" data-act="undo-step"' + (done.length ? '' : ' disabled') + '>한 단계 되돌리기<\/button><button class="btn" data-act="reset-steps">처음부터<\/button><\/div>';
    h += '<ol class="steps">';
    r.steps.forEach(function (s) {
      var isDone = done.indexOf(s.n) >= 0;
      var cls = (isDone ? 'done ' : '') + (!allDone && s.n === cur ? 'current ' : '') + (s.opponent ? 'opp ' : '') + (picked === s.n ? 'picked' : '');
      h += '<li class="' + cls + '" id="step-' + s.n + '"><input type="checkbox" id="cb-' + s.n + '" data-act="toggle-step" data-n="' + s.n + '"' + (isDone ? ' checked' : '') + ' aria-label="' + s.n + '단계 완료">' +
        '<span class="num">' + s.n + '<\/span><label class="txt" for="cb-' + s.n + '">' + hl(s.text) + '<span class="meta">' +
        (s.opponent ? '<span class="tag bad">상대 행동<\/span>' : '') +
        (s.isSummon ? '<span class="tag">소환 ' + s.summonIndex + '번째<\/span>' : '') +
        (picked === s.n ? '<span class="tag bad">여기서 맞음<\/span>' : '') + '<\/span><\/label><\/li>';
    });
    h += '<\/ol><p class="small muted">"소환 n번째"는 앱이 단계 문장(일반소환·특소·링크·엑시즈·융합·싱크로·소생·P소환)으로 센 참고값이다. 한 단계에 여러 장 P소환해도 1번으로 센다.<\/p><\/section>';

    h += '<div class="side"><section class="panel" id="trapPanel">' + renderTrapPanel(r) + '<\/section>';
    h += '<section class="panel">' + renderFinal(r) + '<\/section>';
    h += '<section class="panel">' + renderReverse(r) + '<\/section>';
    h += '<section class="panel">' + renderNotes(r) + '<\/section><\/div><\/div>';
    return h;
  }

  function renderTrapPanel(r) {
    var h = '<h2>패트랩 맞음<\/h2><p class="small muted">맞은 방해를 누르고, 몇 번째 단계에서 맞았는지 고른다.<\/p><div class="trap-grid">';
    C.handTrapButtons.forEach(function (b) {
      var on = state.trap && state.trap.key === b.key && state.trap.routeId === r.id;
      h += '<button class="trap-btn" data-act="trap" data-key="' + b.key + '" aria-pressed="' + (on ? 'true' : 'false') + '">' + esc(b.label) + '<\/button>';
    });
    h += '<\/div>';
    if (!state.trap || state.trap.routeId !== r.id) return h;
    var t = state.trap;
    h += '<h4>몇 번째 단계에서 맞았나<\/h4><select class="full" data-act="trap-step" aria-label="맞은 단계">';
    r.steps.forEach(function (s) {
      h += '<option value="' + s.n + '"' + (s.n === t.step ? ' selected' : '') + '>' + s.n + '. ' + esc(s.text) + (s.isSummon ? ' [소환 ' + s.summonIndex + ']' : '') + '<\/option>';
    });
    h += '<\/select>';
    var out = respond(t.key, r, t.step);
    var step = r.steps.filter(function (s) { return s.n === t.step; })[0];
    h += '<p class="small">' + esc(out.btn.label) + ' → ' + t.step + '단계 "' + hl(step.text) + '"' + ' · 여기까지 소환 ' + summonsUpTo(r, t.step) + '번<\/p>';
    if (out.matches.length) {
      out.matches.forEach(function (m) {
        h += '<div class="box ok"><h4>문서 대응 있음<\/h4><p class="small"><strong>' + hl(m.row.action) + '<\/strong> · 맞는 지점: ' + hl(m.row.timing) + '<\/p>' +
          '<p>' + textBlock(m.row.response) + '<\/p><p class="small muted">문서 최종: ' + hl(m.row.final) + '<\/p>';
        if (m.mode === 'continue') {
          var ff = ffByCard[m.rule.fieldCard];
          h += '<p><strong>' + esc(m.rule.continueText) + '<\/strong><\/p>';
          if (m.zstep) h += '<p class="small">이 루트에서 제우스가 나오는 곳: ' + m.zstep.n + '단계 "' + hl(m.zstep.text) + '" (소환 ' + m.zstep.summonIndex + '번째)<\/p>';
          if (ff) h += '<dl class="kv"><dt>막는 것<\/dt><dd>' + hl(ff.blocks) + '<\/dd><dt>비용·제약<\/dt><dd>' + hl(ff.cost) + '<\/dd><\/dl><p class="small muted">최종 필드 표 · ' + esc(ff.label) + '<\/p>';
          var ex = routesById[m.rule.exampleRoute];
          if (ex) {
            var exs = ex.steps.filter(function (s) { return s.text.indexOf(m.rule.examplePattern) >= 0; });
            if (exs.length) h += '<p class="small">문서 예시(' + ex.id + '):<\/p><ul class="small">' + exs.map(function (s) { return '<li>' + ex.id + ' ' + s.n + '. ' + hl(s.text) + '<\/li>'; }).join('') + '<\/ul>';
          }
        } else {
          m.targets.forEach(function (b) {
            var tr = b.target;
            h += '<div class="route-item"><div class="title">' + routeTitle(tr) + '<\/div>';
            if (tr.id === r.id) h += '<p class="small">지금 루트가 바로 이 상황의 대응 루트다' + (b.opp ? ' (' + b.opp.n + '단계: ' + hl(b.opp.text) + ')' : '') + '.<\/p>';
            else {
              h += '<p class="small">' + (b.opp ? tr.id + ' ' + b.opp.n + '단계가 "' + hl(b.opp.text) + '" → <strong>' + b.from + '단계부터<\/strong> 이어감.' : '') +
                ' 현재 루트와 앞 ' + b.prefix + '단계 문장이 같다.<\/p><p class="small muted">최종: ' + hl(tr.finalText) + '<\/p>' +
                '<button class="btn primary small" data-act="switch-route" data-id="' + tr.id + '" data-upto="' + (b.opp ? b.opp.n : 0) + '">' + tr.id + '로 전환 (1~' + (b.opp ? b.opp.n : 0) + '단계 완료 처리)<\/button>';
            }
            h += '<\/div>';
          });
        }
        (m.rule.needsHand || []).forEach(function (nh) {
          var c = cnt(state.hand, nh.card), entered = handSize(state.hand) > 0;
          h += '<div class="box ' + (!entered ? '' : c ? 'ok' : 'bad') + ' small">조건: 패에 ' + esc(short(nh.card)) + ' — ' + textBlock(nh.why) + '<br>현재 선택한 패: ' + (entered ? c + '장' : '패 미입력') + '<\/div>';
        });
        h += '<\/div>';
      });
    } else {
      h += '<div class="box warn"><h4>문서에 대응 기록 없음<\/h4><p class="small">' + esc(out.btn.label) + '을(를) ' + t.step + '단계에서 맞은 경우의 대응은 dd-guide.md·dd-routes.md에 없다.<\/p>';
      out.mismatch.forEach(function (mm) {
        h += '<p class="small">이 시점(' + hl(mm.row.timing) + ')의 대응 루트 ' + linkIds(esc(mm.row.ids.join('·'))) + '는 시작 이니시가 ' +
          esc(mm.row.ids.map(function (id) { return short(routesById[id].initiator[0]); }).filter(function (v, i, a) { return a.indexOf(v) === i; }).join('·')) +
          '라서, ' + esc(short(r.initiator[0])) + '로 시작한 이 루트에 그대로 쓸 수 있는지는 문서에 없다.<\/p>';
      });
      if (out.hints.length) {
        h += '<p class="small"><strong>이 루트에서 문서 기록이 있는 시점:<\/strong><\/p><ul class="small">' + out.hints.map(function (x) {
          return '<li>' + (x.step ? '<button class="btn small" data-act="trap-step-set" data-n="' + x.step + '">' + x.step + '단계로<\/button> ' : '') + hl(x.row.timing) + ' — ' + hl(x.text) + '<\/li>';
        }).join('') + '<\/ul>';
      }
      h += '<\/div>';
      var qs = out.btn.quotes.map(function (k) { return D.quotes[k]; }).filter(Boolean);
      if (qs.length) h += '<h4>일반 원칙 (문서)<\/h4>' + qs.map(quote).join('');
      var others = C.initiatorCards.filter(function (c) { return cnt(state.hand, c) > 0; });
      if (handSize(state.hand)) {
        var n = initiatorCount(state.hand);
        h += '<p class="small">현재 선택한 패의 이니시: ' + (n ? others.map(function (c) { return esc(short(c)) + ' ' + cnt(state.hand, c) + '장'; }).join(', ') + ' (총 ' + n + '장' + (n >= 2 ? ', 이번 루트에 쓴 1장 외 예비가 있다' : ', 예비 이니시 없음') + ')' : '없음') + '<\/p>';
      }
    }
    if (out.rows.length) {
      h += '<details class="inner"><summary>같은 상대 행동의 문서 기록 전체 (' + out.rows.length + ')<\/summary>' +
        table(['상대 행동', '맞는 지점', '대응 루트', '최종'], out.rows.map(function (x) { return [x.action, x.timing, x.response, x.final]; })) + '<\/details>';
    }
    return h;
  }

  function finalCardsOf(r) {
    var list = r.finalCards.map(function (c) { return { card: c, zone: '필드' }; });
    r.finalExtra.forEach(function (x) { list.push({ card: x.card, zone: x.zone, from: x.from }); });
    return list;
  }

  function renderFinal(r) {
    var h = '<h2>최종 필드<\/h2><p class="small">' + hl(r.finalText) + '<\/p>';
    finalCardsOf(r).forEach(function (fc) {
      var ff = ffByCard[fc.card], ef = effectsByCard[fc.card];
      h += '<div class="ff-card"><div class="name">' + esc(fc.card) + ' <span class="tag">' + esc(fc.zone) + '<\/span><\/div>';
      if (ff) h += '<dl class="kv"><dt>막는 것<\/dt><dd>' + hl(ff.blocks) + '<\/dd><dt>비용·제약<\/dt><dd>' + hl(ff.cost) + '<\/dd><\/dl>';
      else h += '<p class="small"><span class="tag warn">최종 필드 표에 항목 없음<\/span><\/p>';
      if (ef) h += '<p class="small muted">카드 효과 요약: ' + hl(ef.effect) + '<\/p>';
      if (fc.from) h += '<p class="small muted">근거: ' + hl(fc.from) + '<\/p>';
      h += '<\/div>';
    });
    h += '<details class="inner"><summary>최종 필드 문서 메모<\/summary>' + '<p class="small">' + textBlock(D.finalField.intro) + '<\/p>' +
      D.finalField.notes.map(function (n) { return '<p class="small">' + textBlock(n) + '<\/p>'; }).join('') + '<\/details>';
    return h;
  }

  function renderReverse(r) {
    var present = {};
    finalCardsOf(r).forEach(function (fc) { present[fc.card] = fc.zone; });
    var item = C.reverseLookup.filter(function (x) { return x.key === state.rev; })[0] || C.reverseLookup[0];
    var h = '<h2>상대 행동 → 무엇으로 막나<\/h2><p class="small muted">이 루트 최종 필드 기준. 문서의 최종 필드 표·카드 효과 요약 문장만 근거로 쓴다.<\/p>' +
      '<select class="full" data-act="rev" aria-label="상대 행동">' + C.reverseLookup.map(function (x) { return '<option value="' + x.key + '"' + (x.key === item.key ? ' selected' : '') + '>' + esc(x.label) + '<\/option>'; }).join('') + '<\/select>';
    var any = false;
    item.cards.forEach(function (c) {
      var here = present[c.card] && (!c.zone || present[c.card] === c.zone);
      if (here) any = true;
      var ff = ffByCard[c.card], ef = effectsByCard[c.card];
      h += '<div class="ff-card' + (here ? '' : ' absent') + '"><div class="name">' + esc(c.card) + ' ' + (here ? '<span class="tag ok">이 필드에 있음<\/span>' : '<span class="tag">이 루트 최종 필드에 없음<\/span>') +
        ' <span class="tag ' + (c.basis === '명시' ? 'accent' : 'warn') + '">' + hl(c.basis) + '<\/span><\/div><p class="small">' + hl(c.why) + '<\/p>';
      if (ff) h += '<blockquote class="q">막는 것: ' + hl(ff.blocks) + '<br>비용·제약: ' + hl(ff.cost) + '<span class="src">dd-guide.md · 최종 필드와 방해 수 · ' + esc(ff.label) + '<\/span><\/blockquote>';
      if (ef) h += '<blockquote class="q">' + hl(ef.effect) + '<span class="src">dd-guide.md · 핵심 카드 효과 요약 · ' + esc(ef.raw) + '<\/span><\/blockquote>';
      h += '<\/div>';
    });
    if (!any) h += '<div class="box warn small">이 루트 최종 필드에는 이 행동을 막는다고 문서에 적힌 카드가 없다.<\/div>';
    if (item.note) h += '<p class="small muted">' + hl(item.note) + '<\/p>';
    h += '<p class="small muted">"명시" = 문서 문장이 그 행동을 직접 말함. "포괄(해석)" = 문장이 넓게 적혀 있어 포함된다고 앱이 읽은 것.<\/p>';
    return h;
  }

  function renderNotes(r) {
    var h = '<h2>출처·주석<\/h2>';
    if (r.source) h += '<p>원문: <a href="' + esc(r.source.url) + '" target="_blank" rel="noopener">' + esc(r.source.label) + '<\/a> <span class="small muted">' + esc(r.source.url) + '<\/span><\/p>';
    if (!r.notes.length) h += '<p class="muted">주석 없음<\/p>';
    h += '<ul class="small">' + r.notes.map(function (n) { return '<li><span class="tag">' + hl(n.kind) + '<\/span> ' + textBlock(n.text) + '<\/li>'; }).join('') + '<\/ul>';
    return h;
  }

  // ------------------------------------------------------------ 렌더: 전체 루트
  function renderAll() {
    var h = '<section class="panel"><h2>전체 루트 ' + D.routes.length + '개<\/h2><div class="mdoc small">' + md(D.routesIntroMarkdown) + '<\/div><\/section>';
    D.groups.forEach(function (g) {
      h += '<section class="panel"><h3>' + esc(g.id + '. ' + g.title) + '<\/h3>' + (g.headerFinal ? '<p class="small muted">그룹 최종: ' + hl(g.headerFinal) + '<\/p>' : '');
      g.routeIds.forEach(function (id) {
        var r = routesById[id], done = (state.checks[id] || []).length;
        h += '<div class="route-item"><div class="head"><div class="title">' + routeTitle(r) + '<\/div><button class="btn small" data-act="start-route" data-id="' + id + '">진행<\/button><\/div>' +
          '<div class="small muted">이니시: ' + esc(r.initiator.map(short).join(' + ')) + ' · ' + r.steps.length + '단계' + (done ? ' · 체크 ' + done + '개' : '') + ' · 최종: ' + hl(r.finalText) +
          (r.source ? ' · <a href="' + esc(r.source.url) + '" target="_blank" rel="noopener">' + esc(r.source.label) + '<\/a>' : '') + '<\/div><\/div>';
      });
      h += '<\/section>';

  // ------------------------------------------------------------ 렌더: 문서·검사
  function renderDoc() {
    var v = D.validation, fails = v.checks.filter(function (c) { return !c.ok; });
    var h = '<section class="panel"><h2>데이터 검사 결과<\/h2><p>' + (fails.length ? '<span class="tag bad">실패 ' + fails.length + '개<\/span>' : '<span class="tag ok">검사 ' + v.checks.length + '개 모두 통과<\/span>') +
      ' <span class="small muted">생성: ' + esc(D.meta.generatedAt) + '<\/span><\/p>' +
      '<details class="inner"' + (fails.length ? ' open' : '') + '><summary>검사 항목<\/summary><ul class="check-list">' +
      v.checks.map(function (c) { return '<li>' + (c.ok ? '✅' : '❌') + ' ' + hl(c.name) + (c.detail ? ' <span class="muted">— ' + hl(c.detail) + '<\/span>' : '') + '<\/li>'; }).join('') + '<\/ul><\/details>' +
      '<h3>문서끼리 어긋나거나 애매한 곳 (자동 검출)<\/h3><ul class="small">' + v.warnings.map(function (w) { return '<li>' + textBlock(w) + '<\/li>'; }).join('') + '<\/ul><\/section>';
    h += '<section class="panel mdoc"><h2>' + esc(D.meta.guideTitle) + ' <span class="small muted">' + esc(D.meta.guideDate) + '<\/span><\/h2>';
    D.guideSections.forEach(function (s) {
      h += '<details class="inner"><summary>' + esc(s.title) + '<\/summary>' + md(s.markdown) + '<\/details>';
    });
    h += '<\/section>';
    return h;
  }

  // ------------------------------------------------------------ 메인 렌더 · 이벤트
  function render() {
    document.querySelectorAll('.tab').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.tab === state.tab ? 'true' : 'false'); });
    var fn = { hand: renderHand, route: renderRoute, all: renderAll, doc: renderDoc }[state.tab] || renderHand;
    app.innerHTML = fn();
    var themeLabel = { auto: '자동', light: '밝게', dark: '어둡게' }[state.theme] || '자동';
    document.getElementById('themeBtn').textContent = '테마: ' + themeLabel;
    saveState();
  }
  // 페이지를 감싼 환경(웹 게시 화면 등)이 처음 정해 둔 테마는 '자동'일 때 그대로 둔다
  var hostTheme = document.documentElement.getAttribute('data-theme');
  function applyTheme() {
    if (state.theme === 'auto') {
      if (hostTheme) document.documentElement.setAttribute('data-theme', hostTheme);
      else document.documentElement.removeAttribute('data-theme');
    }
    else document.documentElement.setAttribute('data-theme', state.theme);
  }
  function setChecksUpTo(id, n) {
    state.checks[id] = routesById[id].steps.filter(function (s) { return s.n <= n; }).map(function (s) { return s.n; });
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act], [data-tab]');
    if (!el) return;
    var act = el.dataset.act || (el.classList.contains('tab') ? 'tab' : null);
    var r = routesById[state.routeId];
    switch (act) {
      case 'tab': state.tab = el.dataset.tab; render(); window.scrollTo(0, 0); return;
      case 'hand-add': {
        var n = el.dataset.name, c = cardsByName[n];
        if (handSize(state.hand) < HAND_MAX && cnt(state.hand, n) < c.count) state.hand[n] = cnt(state.hand, n) + 1;
        render(); return;
      }
      case 'hand-del': {
        var dn = el.dataset.name;
        if (state.hand[dn] > 1) state.hand[dn]--; else delete state.hand[dn];
        render(); return;
      }
      case 'hand-clear': state.hand = {}; render(); return;
      case 'start-route': case 'open-route':
        state.routeId = el.dataset.id; state.tab = 'route'; state.trap = null; render(); window.scrollTo(0, 0); return;
      case 'next-step':
        if (r) { var cs = currentStep(r); var d = state.checks[r.id] || []; if (d.indexOf(cs) < 0) d.push(cs); state.checks[r.id] = d; render(); scrollToStep(currentStep(r)); }
        return;
      case 'undo-step':
        if (r) { var dd = (state.checks[r.id] || []).slice().sort(function (a, b) { return a - b; }); dd.pop(); state.checks[r.id] = dd; render(); }
        return;
      case 'reset-steps':
        if (r) { state.checks[r.id] = []; state.trap = null; render(); }
        return;
      case 'trap':
        if (r) {
          var k = el.dataset.key;
          if (state.trap && state.trap.key === k && state.trap.routeId === r.id) state.trap = null;
          else state.trap = { key: k, routeId: r.id, step: state.trap && state.trap.routeId === r.id ? state.trap.step : currentStep(r) };
          render(); var tp = document.getElementById('trapPanel'); if (tp && tp.scrollIntoView) tp.scrollIntoView({ block: 'start' });
        }
        return;
      case 'trap-step-set':
        if (state.trap) { state.trap.step = Number(el.dataset.n); render(); var tp2 = document.getElementById('trapPanel'); if (tp2 && tp2.scrollIntoView) tp2.scrollIntoView({ block: 'start' }); }
        return;
      case 'switch-route': {
        var id = el.dataset.id, upto = Number(el.dataset.upto);
        setChecksUpTo(id, upto); state.routeId = id; state.trap = null; render(); window.scrollTo(0, 0); scrollToStep(upto + 1); return;
      }
    }
  });
  document.addEventListener('change', function (e) {
    var el = e.target, act = el.dataset.act, r = routesById[state.routeId];
    if (act === 'toggle-step' && r) {
      var n = Number(el.dataset.n), d = state.checks[r.id] || [];
      if (el.checked) { if (d.indexOf(n) < 0) d.push(n); } else d = d.filter(function (x) { return x !== n; });
      state.checks[r.id] = d; render(); return;
    }
    if (act === 'concern') { state.concern = el.value; render(); return; }
    if (act === 'trap-step' && state.trap) { state.trap.step = Number(el.value); render(); var tp = document.getElementById('trapPanel'); if (tp && tp.scrollIntoView) tp.scrollIntoView({ block: 'start' }); return; }
    if (act === 'rev') { state.rev = el.value; render(); }
  });
  function scrollToStep(n) {
    var li = document.getElementById('step-' + n);
    if (li && li.scrollIntoView) li.scrollIntoView({ block: 'center' });
  }
  document.getElementById('themeBtn').addEventListener('click', function () {
    state.theme = { auto: 'light', light: 'dark', dark: 'auto' }[state.theme] || 'auto';
    applyTheme(); render();
  });

  document.getElementById('foot').innerHTML = '데이터: ' + D.meta.sources.map(esc).join(', ') + ' · 생성 ' + esc(D.meta.generatedAt) +
    ' · 노란 표시(<mark class="m">추정<\/mark> 등)는 문서 원문의 표시를 그대로 강조한 것';
  applyTheme();
  render();
})();
</script>
